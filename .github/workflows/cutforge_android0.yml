              fn import_media_dialog(&mut self) {
                  #[cfg(not(target_arch = "wasm32"))]
                  {
                      if let Some(path) = rfd::FileDialog::new()
                          .add_filter(
                              "Video & Audio Media",
                              &["mp4", "mov", "mkv", "webm", "wav", "mp3", "flac"],
                          )
                          .pick_file()
                      {
                          let file_name = path
                              .file_name()
                              .and_then(|n| n.to_str())
                              .unwrap_or("Imported_Clip.mov")
                              .to_string();
                          let is_audio = file_name.ends_with(".wav")
                              || file_name.ends_with(".mp3")
                              || file_name.ends_with(".flac");
                          let id = self.project.alloc_id();
                          self.project.assets.push(MediaAsset {
                              id,
                              bin_id: if is_audio { 3 } else { 1 },
                              name: file_name.clone(),
                              kind: if is_audio {
                                  AssetKind::Audio
                              } else {
                                  AssetKind::Video
                              },
                              duration_frames: 240,
                              fps: self.project.fps,
                              width: 3840,
                              height: 2160,
                              codec: "Native File Stream".to_string(),
                              color_space: "Rec.709".to_string(),
                              audio_sample_rate: 48000,
                              audio_channels: 2,
                              file_path: path.display().to_string(),
                              proxy_attached: false,
                              in_point: 0,
                              out_point: 180,
                              base_color: [65, 105, 180],
                              secondary_color: [220, 140, 80],
                              scene_pattern: (id % 3) as u8,
                              waveform_peaks: (0..120)
                                  .map(|i| (i as f32 * 0.25).sin().abs() * 0.8 + 0.1)
                                  .collect(),
                          });
                          self.project.source_asset_id = Some(id);
                          self.commit_snapshot(format!("Import Media '{file_name}'"));
                          return;
                      }
                  }
                  // Fallback / synthetic clip generator (always works in Browser WASM and headless environments)
                  let id = self.project.alloc_id();
                  let name = format!("C{:03}_Studio_Take_4K_ProRes.mov", id);
                  self.project.assets.push(MediaAsset {
                      id,
                      bin_id: 1,
                      name: name.clone(),
                      kind: AssetKind::Video,
                      duration_frames: 216,
                      fps: self.project.fps,
                      width: 3840,
                      height: 2160,
                      codec: "Apple ProRes 422 HQ".to_string(),
                      color_space: "Rec.709".to_string(),
                      audio_sample_rate: 48000,
                      audio_channels: 2,
                      file_path: format!("/media/Ingest/{name}"),
                      proxy_attached: true,
                      in_point: 0,
                      out_point: 144,
                      base_color: [52, 118, 165],
                      secondary_color: [235, 148, 72],
                      scene_pattern: (id % 3) as u8,
                      waveform_peaks: (0..120)
                          .map(|i| (i as f32 * 0.22).sin().abs() * 0.75 + 0.15)
                          .collect(),
                  });
                  self.project.source_asset_id = Some(id);
                  self.commit_snapshot(format!("Ingest Synthetic Clip '{name}'"));
              }

              fn render_left_bins_panel(&mut self, ui: &mut Ui) {
                  ui.horizontal(|ui| {
                      ui.heading("📁 Project Bins");
                      ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                          if ui.small_button("+ Ingest Clip").clicked() {
                              self.import_media_dialog();
                          }
                          if ui
                              .selectable_label(self.bin_grid_view, "⊞ Grid")
                              .clicked()
                          {
                              self.bin_grid_view = !self.bin_grid_view;
                          }
                      });
                  });

                  ui.horizontal(|ui| {
                      ui.label("🔍");
                      ui.text_edit_singleline(&mut self.bin_search_query);
                      if !self.bin_search_query.is_empty() && ui.small_button("✖").clicked() {
                          self.bin_search_query.clear();
                      }
                  });

                  // Bin Filter Pills
                  ui.horizontal_wrapped(|ui| {
                      if ui
                          .selectable_label(self.selected_bin_id.is_none(), "All Bins")
                          .clicked()
                      {
                          self.selected_bin_id = None;
                      }
                      for bin in &self.project.bins {
                          let is_sel = self.selected_bin_id == Some(bin.id);
                          let dot = RichText::new("●")
                              .color(Color32::from_rgb(bin.color_tag[0], bin.color_tag[1], bin.color_tag[2]));
                          ui.horizontal(|ui| {
                              ui.label(dot);
                              if ui.selectable_label(is_sel, &bin.name).clicked() {
                                  self.selected_bin_id = Some(bin.id);
                              }
                          });
                      }
                  });

                  ui.separator();

                  let query = self.bin_search_query.to_lowercase();
                  let filtered_assets: Vec<MediaAsset> = self
                      .project
                      .assets
                      .iter()
                      .filter(|a| {
                          let bin_ok = self.selected_bin_id.map(|b| a.bin_id == b).unwrap_or(true);
                          let search_ok = query.is_empty()
                              || a.name.to_lowercase().contains(&query)
                              || a.codec.to_lowercase().contains(&query);
                          bin_ok && search_ok
                      })
                      .cloned()
                      .collect();

                  egui::ScrollArea::vertical()
                      .id_salt("bins_scroll")
                      .auto_shrink([false, false])
                      .show(ui, |ui| {
                          for asset in filtered_assets {
                              let is_source = self.project.source_asset_id == Some(asset.id);
                              let card_bg = if is_source {
                                  Color32::from_rgb(34, 52, 84)
                              } else {
                                  Color32::from_rgb(28, 31, 38)
                              };

                              egui::Frame::NONE
                                  .fill(card_bg)
                                  .corner_radius(CornerRadius::same(5))
                                  .inner_margin(egui::Margin::same(6))
                                  .stroke(Stroke::new(
                                      1.0,
                                      if is_source {
                                          Color32::from_rgb(56, 189, 248)
                                      } else {
                                          Color32::from_rgb(45, 50, 62)
                                      },
                                  ))
                                  .show(ui, |ui| {
                                      ui.horizontal(|ui| {
                                          let badge_color = Color32::from_rgb(
                                              asset.base_color[0],
                                              asset.base_color[1],
                                              asset.base_color[2],
                                          );
                                          ui.label(RichText::new("■").color(badge_color));
                                          if ui
                                              .selectable_label(
                                                  is_source,
                                                  RichText::new(&asset.name).strong(),
                                              )
                                              .clicked()
                                          {
                                              self.project.source_asset_id = Some(asset.id);
                                              self.project.source_playhead_frame = asset.in_point;
                                          }
                                      });

                                      ui.horizontal(|ui| {
                                          let dur_tc = frames_to_smpte(
                                              asset.duration_frames,
                                              asset.fps,
                                              self.project.drop_frame,
                                          );
                                          ui.small(format!(
                                              "{} • {} • {:.0}fps",
                                              dur_tc, asset.codec, asset.fps
                                          ));
                                          if asset.proxy_attached {
                                              ui.small(
                                                  RichText::new("[PROXY]")
                                                      .color(Color32::from_rgb(52, 211, 153)),
                                              );
                                          }
                                      });

                                      ui.horizontal(|ui| {
                                          if ui.small_button("Load in Source").clicked() {
                                              self.project.source_asset_id = Some(asset.id);
                                              self.project.source_playhead_frame = asset.in_point;
                                          }
                                          if ui.small_button("Insert (,)").clicked() {
                                              self.project.source_asset_id = Some(asset.id);
                                              self.insert_from_source();
                                          }
                                          if ui.small_button("Overwrite (.)").clicked() {
                                              self.project.source_asset_id = Some(asset.id);
                                              self.overwrite_from_source();
                                          }
                                      });
                                  });
                              ui.add_space(4.0);
                          }
                      });
              }

