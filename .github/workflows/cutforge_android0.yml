name: CutForge Pro Android APK Build (Rust + WASM + Gradle)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-android-apk:
    name: Compile Rust NLE to Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust Stable + wasm32 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk Bundler
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Bootstrap Rust NLE Source Files
        shell: bash
        run: |
          mkdir -p rust_nle/src
          cat << 'EOF_CARGO' > rust_nle/Cargo.toml
          [package]
          name = "cutforge-pro"
          version = "1.0.0"
          edition = "2021"
          authors = ["CutForge Studio Engineering"]
          description = "Professional cross-platform and WebAssembly Non-Linear Video Editor (NLE) in pure Rust with Premiere Pro workflow, dual monitors, multi-track timeline, Lumetri color grading, audio mixer, captions, customizable shortcuts, and transactional crash recovery."
          license = "MIT OR Apache-2.0"

          [dependencies]
          # Core GUI & rendering framework (macOS, Windows, Linux via wgpu/glow + WebAssembly via Canvas/WebGL2/WebGPU)
          # Docs: https://docs.rs/eframe/latest & https://crates.io/crates/egui
          egui = "0.37"
          eframe = { version = "0.37", default-features = false, features = [
              "default_fonts",
              "glow",
              "persistence",
          ] }

          # Serialization for project files (.cutforge.json), rolling autosaves, and crash recovery journals
          # Docs: https://crates.io/crates/serde & https://crates.io/crates/serde_json
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"

          # Cross-platform time keeping that works identically on Desktop and wasm32-unknown-unknown
          web-time = "1.1"
          log = "0.4"

          # Native Desktop dependencies (macOS, Windows, Linux)
          [target.'cfg(not(target_arch = "wasm32"))'.dependencies]
          env_logger = "0.11"
          # Native OS file open/save dialogs (GTK/XDG Portal on Linux, AppKit on macOS, Win32 on Windows)
          # Docs: https://docs.rs/rfd/latest/rfd/
          rfd = "0.17"

          # Optional native libavcodec/libavformat C-bindings when building with `--features native-ffmpeg`
          # Docs: https://docs.rs/ffmpeg-next/latest/ffmpeg_next/
          ffmpeg-next = { version = "9.1", optional = true }

          # WebAssembly (Browser) dependencies for Trunk (https://trunk-rs.github.io/trunk/)
          [target.'cfg(target_arch = "wasm32")'.dependencies]
          wasm-bindgen = "0.2"
          wasm-bindgen-futures = "0.4"
          web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Storage"] }

          [features]
          default = []
          native-ffmpeg = ["dep:ffmpeg-next"]

          [profile.release]
          opt-level = 3
          lto = "thin"
          codegen-units = 1
          strip = true

          # Optimize dependencies in dev builds so real-time timeline scrubbing & scopes stay at 60 FPS
          [profile.dev.package."*"]
          opt-level = 2
          EOF_CARGO
          cat << 'EOF_MAIN' > rust_nle/src/main.rs
          //! # CutForge Pro — Studio Non-Linear Video Editor (NLE) in Pure Rust
          //!
          //! A fast, reliable, cross-platform (macOS, Windows, Linux) and browser-compatible
          //! (WebAssembly via Trunk) non-linear video editor modeled after Adobe Premiere Pro.
          //!
          //! ## Core Architecture
          //! - **UI & GPU Surface**: Built on [`egui`](https://crates.io/crates/egui) and
          //!   [`eframe`](https://docs.rs/crate/eframe/latest) v0.37 for unified native desktop
          //!   (wgpu/glow) and WebAssembly (`wasm32-unknown-unknown`) execution at 60+ FPS.
          //! - **Dual Monitor Engine**: Independent **Source Monitor** (In/Out marking, subclipping,
          //!   three-point Insert/Overwrite edits, safe margins) and **Program Monitor** (real-time
          //!   multi-track compositor, Lumetri color pipeline, titles, closed captions, and live
          //!   Luma Waveform / RGB Parade / Vectorscope video scopes).
          //! - **Multi-Track Timeline & Precision Trimming**: Supports unlimited Video (`V1..Vn`)
          //!   and Audio (`A1..An`) tracks with Premiere trimming tools: Selection (`V`), Track
          //!   Select Forward (`A`), Ripple Edit (`B`), Roll Edit (`N`), Razor/Blade (`C`),
          //!   Slip (`Y`), and Slide (`U`), plus magnetic snapping (`S`) and sequence markers (`M`).
          //! - **Color, Effects, Audio Mixer, Titles & Captions**: Full Lumetri-style color wheels
          //!   and basic grading, stackable clip effects, per-track audio mixer with 3-band EQ,
          //!   compressor, and LUFS loudness target, Essential Graphics titles, and `.srt`/`.vtt`
          //!   closed captioning.
          //! - **Reliability & Export**: Snapshot-based `UndoStack` with history jumping, customizable
          //!   keyboard shortcuts with conflict detection (`Premiere Pro`, `DaVinci Resolve`,
          //!   `Final Cut Pro` presets), atomic rolling autosave with lockfile crash recovery,
          //!   and a native FFmpeg filtergraph generator + CLI render pipeline (`Ctrl+M`).

          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          use eframe::egui::{
              self, Color32, ColorImage, CornerRadius, FontFamily, FontId, Key, KeyboardShortcut, Modifiers,
              Pos2, Rect, RichText, Sense, Stroke, StrokeKind, TextureHandle, TextureOptions, Ui, Vec2,
          };
          use serde::{Deserialize, Serialize};
          use std::collections::BTreeMap;
          use web_time::{Duration, Instant};

          // ============================================================================
          // 1. ENTRY POINTS (NATIVE DESKTOP & WEBASSEMBLY)
          // ============================================================================

          #[cfg(not(target_arch = "wasm32"))]
          fn main() -> eframe::Result<()> {
              env_logger::init();

              let native_options = eframe::NativeOptions {
                  viewport: egui::ViewportBuilder::default()
                      .with_title("CutForge Pro — Non-Linear Video Editor")
                      .with_inner_size([1600.0, 940.0])
                      .with_min_inner_size([1120.0, 680.0]),
                  ..Default::default()
              };

              eframe::run_native(
                  "CutForge Pro",
                  native_options,
                  Box::new(|cc| Ok(Box::new(CutForgeApp::new(cc)))),
              )
          }

          #[cfg(target_arch = "wasm32")]
          fn main() {
              use wasm_bindgen::JsCast as _;
              eframe::WebLogger::init(log::LevelFilter::Debug).ok();

              let web_options = eframe::WebOptions::default();
              wasm_bindgen_futures::spawn_local(async {
                  let document = web_sys::window()
                      .expect("No browser window")
                      .document()
                      .expect("No browser document");

                  let canvas = document
                      .get_element_by_id("cutforge_canvas")
                      .expect("Failed to find #cutforge_canvas")
                      .dyn_into::<web_sys::HtmlCanvasElement>()
                      .expect("#cutforge_canvas is not a HtmlCanvasElement");

                  let _ = eframe::WebRunner::new()
                      .start(
                          canvas,
                          web_options,
                          Box::new(|cc| Ok(Box::new(CutForgeApp::new(cc)))),
                      )
                      .await;
              });
          }

          // ============================================================================
          // 2. SMPTE TIMECODE & RATIONAL FRAME UTILITIES
          // ============================================================================

          /// Converts a frame index at a given frame rate into standard SMPTE timecode (`HH:MM:SS:FF`).
          pub fn frames_to_smpte(frame: i64, fps: f64, drop_frame: bool) -> String {
              let clamped = frame.max(0);
              let nominal_fps = fps.round().max(1.0) as i64;
              let total_seconds = clamped / nominal_fps;
              let ff = clamped % nominal_fps;
              let ss = total_seconds % 60;
              let mm = (total_seconds / 60) % 60;
              let hh = total_seconds / 3600;
              let sep = if drop_frame { ';' } else { ':' };
              format!("{hh:02}:{mm:02}:{ss:02}{sep}{ff:02}")
          }

          /// Converts a frame index to SubRip (`.srt`) timestamp (`HH:MM:SS,mmm`).
          pub fn frames_to_srt_time(frame: i64, fps: f64) -> String {
              let seconds_total = (frame.max(0) as f64) / fps.max(1.0);
              let total_ms = (seconds_total * 1000.0).round() as u64;
              let ms = total_ms % 1000;
              let total_sec = total_ms / 1000;
              let ss = total_sec % 60;
              let mm = (total_sec / 60) % 60;
              let hh = total_sec / 3600;
              format!("{hh:02}:{mm:02}:{ss:02},{ms:03}")
          }

          /// Converts a frame index to WebVTT (`.vtt`) timestamp (`HH:MM:SS.mmm`).
          pub fn frames_to_vtt_time(frame: i64, fps: f64) -> String {
              frames_to_srt_time(frame, fps).replace(',', ".")
          }

          /// Parses an SMPTE timecode string (`HH:MM:SS:FF` or `MM:SS:FF`) into a frame number.
          pub fn smpte_to_frames(tc: &str, fps: f64) -> Option<i64> {
              let nominal_fps = fps.round().max(1.0) as i64;
              let parts: Vec<&str> = tc.trim().split([':', ';']).collect();
              match parts.as_slice() {
                  [hh, mm, ss, ff] => {
                      let h: i64 = hh.parse().ok()?;
                      let m: i64 = mm.parse().ok()?;
                      let s: i64 = ss.parse().ok()?;
                      let f: i64 = ff.parse().ok()?;
                      Some(((h * 3600 + m * 60 + s) * nominal_fps) + f)
                  }
                  [mm, ss, ff] => {
                      let m: i64 = mm.parse().ok()?;
                      let s: i64 = ss.parse().ok()?;
                      let f: i64 = ff.parse().ok()?;
                      Some(((m * 60 + s) * nominal_fps) + f)
                  }
                  _ => tc.trim().parse::<i64>().ok(),
              }
          }

          // ============================================================================
          // 3. DOMAIN DATA STRUCTURES (PROJECT, BINS, CLIPS, COLOR, AUDIO, CAPTIONS)
          // ============================================================================

          #[derive(Clone, Copy, Debug, PartialEq, Eq, Serialize, Deserialize)]
          pub enum WorkspaceLayout {
              Editing,
              Color,
              Effects,
              Audio,
              TitlesAndCaptions,
              Export,
          }

          impl WorkspaceLayout {
              pub fn all() -> &'static [WorkspaceLayout] {
                  &[
                      WorkspaceLayout::Editing,
                      WorkspaceLayout::Color,
                      WorkspaceLayout::Effects,
                      WorkspaceLayout::Audio,
                      WorkspaceLayout::TitlesAndCaptions,
                      WorkspaceLayout::Export,
                  ]
              }

              pub fn label(&self) -> &'static str {
                  match self {
                      WorkspaceLayout::Editing => "Editing",
                      WorkspaceLayout::Color => "Color",
                      WorkspaceLayout::Effects => "Effects",
                      WorkspaceLayout::Audio => "Audio",
                      WorkspaceLayout::TitlesAndCaptions => "Captions & Graphics",
                      WorkspaceLayout::Export => "Export",
                  }
              }
          }

          /// Premiere-style editing & trimming tools.
          #[derive(Clone, Copy, Debug, PartialEq, Eq, Serialize, Deserialize)]
          pub enum EditTool {
              /// `V` — Standard selection, move, and single-edge trim.
              Selection,
              /// `A` — Track Select Forward: selects all clips from clicked frame onward.
              TrackSelectForward,
              /// `B` — Ripple Edit: trims clip In/Out and shifts all downstream clips automatically.
              RippleEdit,
              /// `N` — Roll Edit: moves the cut point between two adjacent clips simultaneously.
              RollEdit,
              /// `C` — Razor / Blade: splits a clip at the exact clicked frame.
              Razor,
              /// `Y` — Slip: shifts source In/Out inside clip without changing timeline position or duration.
              Slip,
              /// `U` — Slide: moves clip left/right between adjacent neighbors while trimming neighbors.
              Slide,
              /// `H` — Hand: pans timeline view horizontally.
              Hand,
          }

          impl EditTool {
              pub fn label(&self) -> &'static str {
                  match self {
                      EditTool::Selection => "Selection (V)",
                      EditTool::TrackSelectForward => "Track Select Forward (A)",
                      EditTool::RippleEdit => "Ripple Edit (B)",
                      EditTool::RollEdit => "Roll Edit (N)",
                      EditTool::Razor => "Razor / Blade (C)",
                      EditTool::Slip => "Slip Tool (Y)",
                      EditTool::Slide => "Slide Tool (U)",
                      EditTool::Hand => "Hand Tool (H)",
                  }
              }

              pub fn short_badge(&self) -> &'static str {
                  match self {
                      EditTool::Selection => "↖ Selection [V]",
                      EditTool::TrackSelectForward => "⇉ Track Fwd [A]",
                      EditTool::RippleEdit => "⇔ Ripple [B]",
                      EditTool::RollEdit => "⇄ Roll [N]",
                      EditTool::Razor => "✂ Razor [C]",
                      EditTool::Slip => "⇹ Slip [Y]",
                      EditTool::Slide => "⇿ Slide [U]",
                      EditTool::Hand => "✋ Hand [H]",
                  }
              }
          }

          #[derive(Clone, Copy, Debug, PartialEq, Eq, Serialize, Deserialize)]
          pub enum MonitorScopeMode {
              ProgramComposite,
              LumaWaveform,
              RgbParade,
              Vectorscope,
          }

          #[derive(Clone, Copy, Debug, PartialEq, Eq, Serialize, Deserialize)]
          pub enum AssetKind {
              Video,
              Audio,
              TitleGraphic,
              ColorMatte,
              Subclip,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct MediaBin {
              pub id: u64,
              pub name: String,
              pub color_tag: [u8; 3],
              pub expanded: bool,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct MediaAsset {
              pub id: u64,
              pub bin_id: u64,
              pub name: String,
              pub kind: AssetKind,
              pub duration_frames: i64,
              pub fps: f64,
              pub width: u32,
              pub height: u32,
              pub codec: String,
              pub color_space: String,
              pub audio_sample_rate: u32,
              pub audio_channels: u8,
              pub file_path: String,
              pub proxy_attached: bool,
              pub in_point: i64,
              pub out_point: i64,
              pub base_color: [u8; 3],
              pub secondary_color: [u8; 3],
              pub scene_pattern: u8,
              pub waveform_peaks: Vec<f32>,
          }

          #[derive(Clone, Copy, Debug, PartialEq, Eq, Serialize, Deserialize)]
          pub enum LutPreset {
              None,
              Rec709Standard,
              Kodak2383Print,
              TealAndOrange,
              CineLogToRec709,
              BleachBypass,
              MonochromeNoir,
          }

          impl LutPreset {
              pub fn all() -> &'static [LutPreset] {
                  &[
                      LutPreset::None,
                      LutPreset::Rec709Standard,
                      LutPreset::Kodak2383Print,
                      LutPreset::TealAndOrange,
                      LutPreset::CineLogToRec709,
                      LutPreset::BleachBypass,
                      LutPreset::MonochromeNoir,
                  ]
              }

              pub fn label(&self) -> &'static str {
                  match self {
                      LutPreset::None => "None (Bypass)",
                      LutPreset::Rec709Standard => "Rec.709 Broadcast Standard",
                      LutPreset::Kodak2383Print => "Kodak 2383 Film Print Emulation",
                      LutPreset::TealAndOrange => "Blockbuster Teal & Orange",
                      LutPreset::CineLogToRec709 => "ARRI LogC / CineLog -> Rec.709",
                      LutPreset::BleachBypass => "Silver Retention Bleach Bypass",
                      LutPreset::MonochromeNoir => "Tri-X 400 Monochrome Noir",
                  }
              }
          }

          /// Lumetri-style Color Correction and Grading parameters.
          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct LumetriGrade {
              pub enabled: bool,
              /// White balance temperature (-100.0 cool to +100.0 warm)
              pub temperature: f32,
              /// White balance tint (-100.0 green to +100.0 magenta)
              pub tint: f32,
              /// Exposure in EV stops (-4.0 to +4.0)
              pub exposure: f32,
              /// Contrast (-100.0 to +100.0)
              pub contrast: f32,
              /// Highlights recovery/boost (-100.0 to +100.0)
              pub highlights: f32,
              /// Shadows crush/lift (-100.0 to +100.0)
              pub shadows: f32,
              /// Whites point (-100.0 to +100.0)
              pub whites: f32,
              /// Blacks point (-100.0 to +100.0)
              pub blacks: f32,
              /// Saturation (0.0 monochrome to 200.0 hyper-saturated, 100.0 nominal)
              pub saturation: f32,
              /// Vibrance (-100.0 to +100.0)
              pub vibrance: f32,
              /// 3-Way Color Wheels: RGB offsets (-1.0 to +1.0)
              pub lift_rgb: [f32; 3],
              pub gamma_rgb: [f32; 3],
              pub gain_rgb: [f32; 3],
              /// Creative Look LUT & Mix
              pub lut_preset: LutPreset,
              pub lut_intensity: f32,
              /// Vignette
              pub vignette_amount: f32,
              pub vignette_midpoint: f32,
              pub vignette_feather: f32,
          }

          impl Default for LumetriGrade {
              fn default() -> Self {
                  Self {
                      enabled: true,
                      temperature: 0.0,
                      tint: 0.0,
                      exposure: 0.0,
                      contrast: 0.0,
                      highlights: 0.0,
                      shadows: 0.0,
                      whites: 0.0,
                      blacks: 0.0,
                      saturation: 100.0,
                      vibrance: 0.0,
                      lift_rgb: [0.0, 0.0, 0.0],
                      gamma_rgb: [0.0, 0.0, 0.0],
                      gain_rgb: [0.0, 0.0, 0.0],
                      lut_preset: LutPreset::None,
                      lut_intensity: 100.0,
                      vignette_amount: 0.0,
                      vignette_midpoint: 50.0,
                      vignette_feather: 50.0,
                  }
              }
          }

          impl LumetriGrade {
              /// Evaluates the full color pipeline on a normalized RGB pixel `[0.0..1.0]` at normalized UV `(u, v)`.
              pub fn evaluate_pixel(&self, mut r: f32, mut g: f32, mut b: f32, u: f32, v: f32) -> [f32; 3] {
                  if !self.enabled {
                      return [r.clamp(0.0, 1.0), g.clamp(0.0, 1.0), b.clamp(0.0, 1.0)];
                  }

                  // 1. Exposure (2^EV)
                  let exp_mult = 2.0_f32.powf(self.exposure);
                  r *= exp_mult;
                  g *= exp_mult;
                  b *= exp_mult;

                  // 2. White Balance (Temperature & Tint)
                  let temp = self.temperature * 0.0022;
                  let tint = self.tint * 0.0020;
                  r += temp + tint * 0.4;
                  g -= tint;
                  b -= temp - tint * 0.4;

                  // 3. Three-Way Color Wheels (Lift / Gamma / Gain)
                  r = r * (1.0 + self.gain_rgb[0] * 0.6) + self.lift_rgb[0] * 0.25;
                  g = g * (1.0 + self.gain_rgb[1] * 0.6) + self.lift_rgb[1] * 0.25;
                  b = b * (1.0 + self.gain_rgb[2] * 0.6) + self.lift_rgb[2] * 0.25;

                  let gamma_r = (1.0 - self.gamma_rgb[0] * 0.45).max(0.2);
                  let gamma_g = (1.0 - self.gamma_rgb[1] * 0.45).max(0.2);
                  let gamma_b = (1.0 - self.gamma_rgb[2] * 0.45).max(0.2);
                  r = r.max(0.0).powf(gamma_r);
                  g = g.max(0.0).powf(gamma_g);
                  b = b.max(0.0).powf(gamma_b);

                  // 4. Shadows, Highlights, Whites, Blacks
                  let luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                  let shadow_weight = (1.0 - luma).clamp(0.0, 1.0).powi(2);
                  let highlight_weight = luma.clamp(0.0, 1.0).powi(2);
                  let tone_delta = (self.shadows * 0.003 * shadow_weight)
                      + (self.highlights * 0.003 * highlight_weight)
                      + (self.blacks * 0.002 * (1.0 - luma))
                      + (self.whites * 0.002 * luma);
                  r += tone_delta;
                  g += tone_delta;
                  b += tone_delta;

                  // 5. Contrast around 0.5 midpoint
                  let c_factor = (100.0 + self.contrast) / 100.0;
                  let c_factor = c_factor * c_factor;
                  r = (r - 0.5) * c_factor + 0.5;
                  g = (g - 0.5) * c_factor + 0.5;
                  b = (b - 0.5) * c_factor + 0.5;

                  // 6. Saturation & Vibrance
                  let luma_now = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                  let max_c = r.max(g).max(b);
                  let min_c = r.min(g).min(b);
                  let current_sat = (max_c - min_c).clamp(0.0, 1.0);
                  let vibrance_boost = (self.vibrance / 100.0) * (1.0 - current_sat);
                  let sat_mult = ((self.saturation / 100.0) + vibrance_boost).max(0.0);
                  r = luma_now + (r - luma_now) * sat_mult;
                  g = luma_now + (g - luma_now) * sat_mult;
                  b = luma_now + (b - luma_now) * sat_mult;

                  // 7. Creative LUT Emulation
                  if self.lut_preset != LutPreset::None && self.lut_intensity > 0.0 {
                      let mix = (self.lut_intensity / 100.0).clamp(0.0, 1.0);
                      let (lr, lg, lb) = match self.lut_preset {
                          LutPreset::None => (r, g, b),
                          LutPreset::Rec709Standard => (
                              (r * 1.03).clamp(0.0, 1.0),
                              (g * 1.01).clamp(0.0, 1.0),
                              (b * 0.98).clamp(0.0, 1.0),
                          ),
                          LutPreset::Kodak2383Print => {
                              // S-curve + warm highlights + deep teal shadows
                              let sr = r.clamp(0.0, 1.0);
                              let sg = g.clamp(0.0, 1.0);
                              let sb = b.clamp(0.0, 1.0);
                              (
                                  (sr * 1.08 + 0.02 * luma_now).clamp(0.0, 1.0),
                                  (sg * 1.01).clamp(0.0, 1.0),
                                  (sb * 0.92 + 0.05 * (1.0 - luma_now)).clamp(0.0, 1.0),
                              )
                          }
                          LutPreset::TealAndOrange => {
                              let shadow = (1.0 - luma_now).clamp(0.0, 1.0);
                              let hi = luma_now.clamp(0.0, 1.0);
                              (
                                  r + 0.14 * hi - 0.06 * shadow,
                                  g + 0.03 * hi + 0.02 * shadow,
                                  b - 0.10 * hi + 0.14 * shadow,
                              )
                          }
                          LutPreset::CineLogToRec709 => (
                              ((r - 0.12) * 1.32).clamp(0.0, 1.0),
                              ((g - 0.12) * 1.30).clamp(0.0, 1.0),
                              ((b - 0.12) * 1.28).clamp(0.0, 1.0),
                          ),
                          LutPreset::BleachBypass => {
                              let silver = luma_now;
                              let cr = (r * 0.45 + silver * 0.55 - 0.5) * 1.35 + 0.5;
                              let cg = (g * 0.45 + silver * 0.55 - 0.5) * 1.35 + 0.5;
                              let cb = (b * 0.45 + silver * 0.55 - 0.5) * 1.35 + 0.5;
                              (cr, cg, cb)
                          }
                          LutPreset::MonochromeNoir => {
                              let mono = (0.299 * r + 0.587 * g + 0.114 * b - 0.5) * 1.25 + 0.5;
                              (mono, mono, mono)
                          }
                      };
                      r = r * (1.0 - mix) + lr * mix;
                      g = g * (1.0 - mix) + lg * mix;
                      b = b * (1.0 - mix) + lb * mix;
                  }

                  // 8. Optical Vignette
                  if self.vignette_amount.abs() > 0.01 {
                      let dx = (u - 0.5) * 2.0;
                      let dy = (v - 0.5) * 2.0;
                      let dist = (dx * dx + dy * dy).sqrt();
                      let mid = (self.vignette_midpoint / 100.0) * 1.3;
                      let feather = (self.vignette_feather / 100.0).max(0.08);
                      let vig = ((dist - mid) / feather).clamp(0.0, 1.0);
                      let factor = 1.0 + (self.vignette_amount / 100.0) * (vig * vig);
                      r *= factor;
                      g *= factor;
                      b *= factor;
                  }

                  [r.clamp(0.0, 1.0), g.clamp(0.0, 1.0), b.clamp(0.0, 1.0)]
              }
          }

