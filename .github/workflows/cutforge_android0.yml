              pub fn davinci_resolve_preset() -> Self {
                  let mut p = Self::premiere_pro_default();
                  p.preset_name = "DaVinci Resolve Studio".to_string();
                  p.bindings
                      .insert(ShortcutAction::ToolRazor, KeyBind::plain("B"));
                  p.bindings
                      .insert(ShortcutAction::ToolRippleEdit, KeyBind::plain("T"));
                  p.bindings
                      .insert(ShortcutAction::RazorAtPlayhead, KeyBind::cmd("B"));
                  p
              }

              pub fn final_cut_pro_preset() -> Self {
                  let mut p = Self::premiere_pro_default();
                  p.preset_name = "Final Cut Pro X".to_string();
                  p.bindings
                      .insert(ShortcutAction::ToolSelection, KeyBind::plain("A"));
                  p.bindings
                      .insert(ShortcutAction::ToolRazor, KeyBind::plain("B"));
                  p.bindings
                      .insert(ShortcutAction::InsertFromSource, KeyBind::plain("W"));
                  p.bindings
                      .insert(ShortcutAction::OverwriteFromSource, KeyBind::plain("E"));
                  p
              }

              /// Returns any duplicate shortcut conflicts across actions.
              pub fn find_conflicts(&self) -> Vec<(ShortcutAction, ShortcutAction, String)> {
                  let mut conflicts = Vec::new();
                  let items: Vec<_> = self.bindings.iter().collect();
                  for i in 0..items.len() {
                      for j in (i + 1)..items.len() {
                          if items[i].1 == items[j].1 {
                              conflicts.push((*items[i].0, *items[j].0, items[i].1.display()));
                          }
                      }
                  }
                  conflicts
              }
          }

