              fn render_lumetri_color_inspector(&mut self, ui: &mut Ui) {
                  let Some(sel_id) = self.selected_clip_id else {
                      ui.label("Select a timeline clip to grade with Lumetri Color.");
                      return;
                  };
                  let Some(clip_idx) = self.project.clips.iter().position(|c| c.id == sel_id) else {
                      ui.label("Selected clip not found on timeline.");
                      return;
                  };

                  let mut grade_changed = false;
                  let clip_name = self.project.clips[clip_idx].name.clone();
                  ui.horizontal(|ui| {
                      ui.strong(format!("Clip: {clip_name}"));
                      if ui.small_button("Reset Grade").clicked() {
                          self.project.clips[clip_idx].grade = LumetriGrade::default();
                          grade_changed = true;
                      }
                  });

                  let grade = &mut self.project.clips[clip_idx].grade;
                  ui.checkbox(&mut grade.enabled, "Enable Lumetri Color Pipeline");
                  ui.separator();

                  egui::CollapsingHeader::new("1. Creative Look & LUT")
                      .default_open(true)
                      .show(ui, |ui| {
                          egui::ComboBox::from_label("Look LUT")
                              .selected_text(grade.lut_preset.label())
                              .show_ui(ui, |ui| {
                                  for preset in LutPreset::all() {
                                      if ui
                                          .selectable_value(&mut grade.lut_preset, *preset, preset.label())
                                          .changed()
                                      {
                                          grade_changed = true;
                                      }
                                  }
                              });
                          grade_changed |= ui
                              .add(egui::Slider::new(&mut grade.lut_intensity, 0.0..=100.0).text("Intensity %"))
                              .changed();
                          grade_changed |= ui
                              .add(egui::Slider::new(&mut grade.vibrance, -100.0..=100.0).text("Vibrance"))
                              .changed();
                          grade_changed |= ui
                              .add(egui::Slider::new(&mut grade.saturation, 0.0..=200.0).text("Saturation %"))
                              .changed();
                      });

                  egui::CollapsingHeader::new("2. Basic Correction (WB & Tone)")
                      .default_open(true)
                      .show(ui, |ui| {
                          grade_changed |= ui
                              .add(
                                  egui::Slider::new(&mut grade.temperature, -100.0..=100.0)
                                      .text("Temperature (Cool/Warm)"),
                              )
                              .changed();
                          grade_changed |= ui
                              .add(
                                  egui::Slider::new(&mut grade.tint, -100.0..=100.0)
                                      .text("Tint (Green/Magenta)"),
                              )
                              .changed();
                          ui.separator();
                          grade_changed |= ui
                              .add(
                                  egui::Slider::new(&mut grade.exposure, -4.0..=4.0)
                                      .text("Exposure (EV)"),
                              )
                              .changed();
                          grade_changed |= ui
                              .add(egui::Slider::new(&mut grade.contrast, -100.0..=100.0).text("Contrast"))
                              .changed();
                          grade_changed |= ui
                              .add(
                                  egui::Slider::new(&mut grade.highlights, -100.0..=100.0).text("Highlights"),
                              )
                              .changed();
                          grade_changed |= ui
                              .add(egui::Slider::new(&mut grade.shadows, -100.0..=100.0).text("Shadows"))
                              .changed();
                          grade_changed |= ui
                              .add(egui::Slider::new(&mut grade.whites, -100.0..=100.0).text("Whites"))
                              .changed();
                          grade_changed |= ui
                              .add(egui::Slider::new(&mut grade.blacks, -100.0..=100.0).text("Blacks"))
                              .changed();
                      });

                  egui::CollapsingHeader::new("3. Three-Way Color Wheels (Lift / Gamma / Gain)")
                      .default_open(true)
                      .show(ui, |ui| {
                          ui.small("Shadows (Lift) RGB Bias:");
                          ui.horizontal(|ui| {
                              grade_changed |= ui
                                  .add(egui::DragValue::new(&mut grade.lift_rgb[0]).speed(0.01).prefix("R: "))
                                  .changed();
                              grade_changed |= ui
                                  .add(egui::DragValue::new(&mut grade.lift_rgb[1]).speed(0.01).prefix("G: "))
                                  .changed();
                              grade_changed |= ui
                                  .add(egui::DragValue::new(&mut grade.lift_rgb[2]).speed(0.01).prefix("B: "))
                                  .changed();
                          });
                          ui.small("Midtones (Gamma) RGB Bias:");
                          ui.horizontal(|ui| {
                              grade_changed |= ui
                                  .add(
                                      egui::DragValue::new(&mut grade.gamma_rgb[0])
                                          .speed(0.01)
                                          .prefix("R: "),
                                  )
                                  .changed();
                              grade_changed |= ui
                                  .add(
                                      egui::DragValue::new(&mut grade.gamma_rgb[1])
                                          .speed(0.01)
                                          .prefix("G: "),
                                  )
                                  .changed();
                              grade_changed |= ui
                                  .add(
                                      egui::DragValue::new(&mut grade.gamma_rgb[2])
                                          .speed(0.01)
                                          .prefix("B: "),
                                  )
                                  .changed();
                          });
                          ui.small("Highlights (Gain) RGB Bias:");
                          ui.horizontal(|ui| {
                              grade_changed |= ui
                                  .add(egui::DragValue::new(&mut grade.gain_rgb[0]).speed(0.01).prefix("R: "))
                                  .changed();
                              grade_changed |= ui
                                  .add(egui::DragValue::new(&mut grade.gain_rgb[1]).speed(0.01).prefix("G: "))
                                  .changed();
                              grade_changed |= ui
                                  .add(egui::DragValue::new(&mut grade.gain_rgb[2]).speed(0.01).prefix("B: "))
                                  .changed();
                          });
                      });

                  egui::CollapsingHeader::new("4. Optical Vignette")
                      .default_open(false)
                      .show(ui, |ui| {
                          grade_changed |= ui
                              .add(
                                  egui::Slider::new(&mut grade.vignette_amount, -100.0..=100.0)
                                      .text("Amount"),
                              )
                              .changed();
                          grade_changed |= ui
                              .add(
                                  egui::Slider::new(&mut grade.vignette_midpoint, 0.0..=100.0)
                                      .text("Midpoint"),
                              )
                              .changed();
                          grade_changed |= ui
                              .add(
                                  egui::Slider::new(&mut grade.vignette_feather, 5.0..=100.0)
                                      .text("Feather"),
                              )
                              .changed();
                      });

                  if grade_changed {
                      self.dirty_since_save = true;
                  }
              }

              fn render_effects_and_transform_inspector(&mut self, ui: &mut Ui) {
                  let Some(sel_id) = self.selected_clip_id else {
                      ui.label("Select a timeline clip to edit Motion Transform, Effects & Transitions.");
                      return;
                  };
                  let Some(clip_idx) = self.project.clips.iter().position(|c| c.id == sel_id) else {
                      return;
                  };

                  ui.strong(format!("Effect Controls — {}", self.project.clips[clip_idx].name));
                  ui.separator();

                  egui::CollapsingHeader::new("Motion & 2D Transform")
                      .default_open(true)
                      .show(ui, |ui| {
                          let tr = &mut self.project.clips[clip_idx].transform;
                          ui.add(egui::Slider::new(&mut tr.pos_x, -960.0..=960.0).text("Position X (px)"));
                          ui.add(egui::Slider::new(&mut tr.pos_y, -540.0..=540.0).text("Position Y (px)"));
                          ui.add(egui::Slider::new(&mut tr.scale_pct, 10.0..=300.0).text("Scale %"));
                          ui.add(egui::Slider::new(&mut tr.opacity_pct, 0.0..=100.0).text("Opacity %"));
                          ui.add(egui::Slider::new(&mut tr.crop_left_pct, 0.0..=45.0).text("Crop Left %"));
                          ui.add(egui::Slider::new(&mut tr.crop_right_pct, 0.0..=45.0).text("Crop Right %"));
                          if ui.small_button("Reset Transform").clicked() {
                              *tr = Transform2D::default();
                          }
                      });

                  egui::CollapsingHeader::new("Time Remapping & Transitions")
                      .default_open(true)
                      .show(ui, |ui| {
                          let clip = &mut self.project.clips[clip_idx];
                          ui.add(
                              egui::Slider::new(&mut clip.speed_pct, 25.0..=400.0).text("Playback Speed %"),
                          );
                          ui.checkbox(&mut clip.reverse, "Reverse Speed Direction");
                          ui.separator();
                          ui.horizontal(|ui| {
                              if ui.small_button("+ Cross Dissolve In").clicked() {
                                  clip.transition_in = Some(TransitionSpec {
                                      kind: TransitionKind::CrossDissolve,
                                      duration_frames: 12,
                                  });
                              }
                              if ui.small_button("+ Dip to Black Out").clicked() {
                                  clip.transition_out = Some(TransitionSpec {
                                      kind: TransitionKind::DipToBlack,
                                      duration_frames: 15,
                                  });
                              }
                          });
                      });

                  egui::CollapsingHeader::new("Clip FX Stack")
                      .default_open(true)
                      .show(ui, |ui| {
                          ui.horizontal_wrapped(|ui| {
                              for kind in EffectKind::all() {
                                  if ui.small_button(format!("+ {}", kind.label())).clicked() {
                                      self.project.clips[clip_idx].effects.push(ClipEffect {
                                          kind: *kind,
                                          enabled: true,
                                          amount: 25.0,
                                      });
                                  }
                              }
                          });
                          ui.separator();
                          let mut remove_idx = None;
                          for (i, fx) in self.project.clips[clip_idx].effects.iter_mut().enumerate() {
                              ui.horizontal(|ui| {
                                  ui.checkbox(&mut fx.enabled, fx.kind.label());
                                  ui.add(egui::Slider::new(&mut fx.amount, 0.0..=100.0));
                                  if ui.small_button("✖").clicked() {
                                      remove_idx = Some(i);
                                  }
                              });
                          }
                          if let Some(r) = remove_idx {
                              self.project.clips[clip_idx].effects.remove(r);
                          }
                      });
              }

              fn render_audio_mixer_inspector(&mut self, ui: &mut Ui) {
                  ui.heading("🎚 Audio Track Mixer & DSP");
                  ui.horizontal(|ui| {
                      ui.add(
                          egui::Slider::new(&mut self.project.master_lufs_target, -24.0..=-9.0)
                              .text("Loudness Target (LUFS)"),
                      );
                      ui.checkbox(&mut self.project.master_limiter_enabled, "True-Peak Limiter (-1.0 dBTP)");
                  });
                  ui.separator();

                  let playhead = self.project.playhead_frame;
                  for track in &mut self.project.tracks {
                      if track.kind != TrackKind::Audio {
                          continue;
                      }
                      egui::Frame::NONE
                          .fill(Color32::from_rgb(28, 31, 38))
                          .corner_radius(CornerRadius::same(6))
                          .inner_margin(egui::Margin::same(8))
                          .show(ui, |ui| {
                              ui.horizontal(|ui| {
                                  ui.strong(&track.name);
                                  let mute_label = if track.visible_or_unmuted { "M" } else { "MUTED" };
                                  if ui
                                      .selectable_label(!track.visible_or_unmuted, mute_label)
                                      .clicked()
                                  {
                                      track.visible_or_unmuted = !track.visible_or_unmuted;
                                  }
                                  if ui.selectable_label(track.solo, "S").clicked() {
                                      track.solo = !track.solo;
                                  }
                                  if ui.selectable_label(track.record_armed, "● R").clicked() {
                                      track.record_armed = !track.record_armed;
                                  }
                              });

                              // Animated Peak Meter
                              let meter_level = if track.visible_or_unmuted {
                                  let phase = ((playhead as f32) * 0.23 + (track.index as f32) * 1.9).sin().abs();
                                  let gain_lin = 10.0_f32.powf(track.gain_db / 20.0);
                                  (phase * 0.72 * gain_lin).clamp(0.04, 1.0)
                              } else {
                                  0.0
                              };
                              let (rect, _) =
                                  ui.allocate_exact_size(Vec2::new(ui.available_width(), 10.0), Sense::hover());
                              ui.painter()
                                  .rect_filled(rect, 3.0, Color32::from_rgb(14, 16, 20));
                              let fill_w = rect.width() * meter_level;
                              let meter_col = if meter_level > 0.88 {
                                  Color32::from_rgb(248, 113, 113)
                              } else if meter_level > 0.70 {
                                  Color32::from_rgb(251, 191, 36)
                              } else {
                                  Color32::from_rgb(52, 211, 153)
                              };
                              ui.painter().rect_filled(
                                  Rect::from_min_size(rect.min, Vec2::new(fill_w, rect.height())),
                                  3.0,
                                  meter_col,
                              );

                              ui.add(
                                  egui::Slider::new(&mut track.gain_db, -60.0..=12.0).text("Fader (dB)"),
                              );
                              ui.add(egui::Slider::new(&mut track.pan, -1.0..=1.0).text("Stereo Pan (L/R)"));

                              ui.horizontal(|ui| {
                                  ui.small("3-Band EQ (dB):");
                                  ui.add(
                                      egui::DragValue::new(&mut track.eq_low_db)
                                          .speed(0.2)
                                          .prefix("Low: "),
                                  );
                                  ui.add(
                                      egui::DragValue::new(&mut track.eq_mid_db)
                                          .speed(0.2)
                                          .prefix("Mid: "),
                                  );
                                  ui.add(
                                      egui::DragValue::new(&mut track.eq_high_db)
                                          .speed(0.2)
                                          .prefix("High: "),
                                  );
                              });
                              ui.horizontal(|ui| {
                                  ui.checkbox(&mut track.comp_enabled, "Compressor");
                                  ui.add(
                                      egui::DragValue::new(&mut track.comp_threshold_db)
                                          .speed(0.5)
                                          .prefix("Thresh: "),
                                  );
                                  ui.add(
                                      egui::DragValue::new(&mut track.comp_ratio)
                                          .speed(0.1)
                                          .prefix("Ratio: "),
                                  );
                              });
                          });
                      ui.add_space(6.0);
                  }
              }

              fn render_titles_and_captions_inspector(&mut self, ui: &mut Ui) {
                  ui.heading("💬 Closed Captions & Essential Graphics");

                  egui::CollapsingHeader::new("Essential Graphics Title Inspector")
                      .default_open(true)
                      .show(ui, |ui| {
                          if let Some(sel_id) = self.selected_clip_id {
                              if let Some(clip) = self.project.clips.iter_mut().find(|c| c.id == sel_id) {
                                  if let Some(title) = &mut clip.title_overlay {
                                      ui.label("Headline Text:");
                                      ui.text_edit_singleline(&mut title.headline);
                                      ui.label("Subtitle / Lower-Third Line:");
                                      ui.text_edit_singleline(&mut title.subtitle);
                                      ui.add(
                                          egui::Slider::new(&mut title.font_size, 12.0..=48.0)
                                              .text("Font Size"),
                                      );
                                      ui.add(
                                          egui::Slider::new(&mut title.pos_y_norm, 0.05..=0.92)
                                              .text("Vertical Position"),
                                      );
                                      ui.add(
                                          egui::Slider::new(&mut title.box_opacity, 0.0..=1.0)
                                              .text("Backdrop Opacity"),
                                      );
                                      ui.checkbox(&mut title.lower_third_style, "Lower-Third Accent Bar");
                                  } else if ui.button("+ Attach Title Overlay to Selected Clip").clicked() {
                                      clip.title_overlay = Some(TitleOverlay::default());
                                  }
                              }
                          } else {
                              ui.small("Select a clip on the timeline to edit its Title Graphic.");
                          }
                      });

                  ui.separator();

                  ui.horizontal(|ui| {
                      ui.strong(format!("Captions Track ({} segments)", self.project.captions.len()));
                      if ui.small_button("+ Add Caption at Playhead").clicked() {
                          let id = self.project.alloc_id();
                          let start = self.project.playhead_frame;
                          self.project.captions.push(CaptionSegment {
                              id,
                              start_frame: start,
                              end_frame: start + 72,
                              speaker: "SPEAKER".to_string(),
                              text: "New caption subtitle segment.".to_string(),
                              enabled: true,
                          });
                          self.commit_snapshot("Add Caption Segment");
                      }
                  });

                  let fps = self.project.fps;
                  let drop = self.project.drop_frame;
                  let mut jump_to_frame = None;
                  for cap in &mut self.project.captions {
                      egui::Frame::NONE
                          .fill(Color32::from_rgb(28, 31, 38))
                          .corner_radius(CornerRadius::same(4))
                          .inner_margin(egui::Margin::same(6))
                          .show(ui, |ui| {
                              ui.horizontal(|ui| {
                                  ui.checkbox(&mut cap.enabled, "");
                                  let tc_in = frames_to_smpte(cap.start_frame, fps, drop);
                                  let tc_out = frames_to_smpte(cap.end_frame, fps, drop);
                                  if ui.small_button(format!("{tc_in} -> {tc_out}")).clicked() {
                                      jump_to_frame = Some(cap.start_frame);
                                  }
                                  ui.text_edit_singleline(&mut cap.speaker);
                              });
                              ui.text_edit_singleline(&mut cap.text);
                          });
                      ui.add_space(4.0);
                  }
                  if let Some(f) = jump_to_frame {
                      self.project.playhead_frame = f;
                  }
              }

              // ========================================================================
              // 13. DUAL MONITORS (SOURCE MONITOR + PROGRAM MONITOR + VIDEO SCOPES)
              // ========================================================================

              fn render_dual_monitors(&mut self, ctx: &egui::Context, ui: &mut Ui) {
                  let total_w = ui.available_width();
                  let half_w = ((total_w - 14.0) * 0.5).max(260.0);
                  let avail_h = ui.available_height();

                  ui.horizontal(|ui| {
                      // ----------------------------------------------------------------
                      // LEFT: SOURCE MONITOR
                      // ----------------------------------------------------------------
                      ui.allocate_ui(Vec2::new(half_w, avail_h), |ui| {
                          egui::Frame::NONE
                              .fill(Color32::from_rgb(17, 19, 24))
                              .corner_radius(CornerRadius::same(6))
                              .inner_margin(egui::Margin::same(8))
                              .stroke(Stroke::new(1.0, Color32::from_rgb(40, 44, 54)))
                              .show(ui, |ui| {
                                  let source_asset = self
                                      .project
                                      .source_asset_id
                                      .and_then(|id| self.project.assets.iter().find(|a| a.id == id))
                                      .cloned();

                                  ui.horizontal(|ui| {
                                      ui.strong("SOURCE MONITOR");
                                      if let Some(a) = &source_asset {
                                          ui.label(
                                              RichText::new(&a.name)
                                                  .color(Color32::from_rgb(148, 163, 184)),
                                          );
                                      }
                                      ui.with_layout(
                                          egui::Layout::right_to_left(egui::Align::Center),
                                          |ui| {
                                              let tc = frames_to_smpte(
                                                  self.project.source_playhead_frame,
                                                  self.project.fps,
                                                  self.project.drop_frame,
                                              );
                                              ui.monospace(
                                                  RichText::new(tc)
                                                      .strong()
                                                      .color(Color32::from_rgb(56, 189, 248)),
                                              );
                                          },
                                      );
                                  });

                                  // Synthesize and display Source Frame Texture
                                  let img = self.synthesize_source_frame(240, 135);
                                  let tex = self.source_texture.get_or_insert_with(|| {
                                      ctx.load_texture("source_monitor_tex", img.clone(), TextureOptions::LINEAR)
                                  });
                                  tex.set(img, TextureOptions::LINEAR);

                                  let canvas_h = (ui.available_height() - 62.0).max(110.0);
                                  let (viewport_rect, resp) = ui.allocate_exact_size(
                                      Vec2::new(ui.available_width(), canvas_h),
                                      Sense::click_and_drag(),
                                  );
                                  ui.painter().rect_filled(
                                      viewport_rect,
                                      4.0,
                                      Color32::from_rgb(10, 11, 14),
                                  );

                                  // Aspect-fitted 16:9 rect
                                  let fit_w = viewport_rect.width().min(viewport_rect.height() * (16.0 / 9.0));
                                  let fit_h = fit_w * (9.0 / 16.0);
                                  let frame_rect =
                                      Rect::from_center_size(viewport_rect.center(), Vec2::new(fit_w, fit_h));

                                  ui.painter().image(
                                      tex.id(),
                                      frame_rect,
                                      Rect::from_min_max(Pos2::ZERO, Pos2::new(1.0, 1.0)),
                                      Color32::WHITE,
                                  );

                                  if self.show_safe_margins {
                                      Self::draw_safe_margins(ui.painter(), frame_rect);
                                  }

                                  if let Some(asset) = &source_asset {
                                      if resp.hovered() && resp.dragged() {
                                          if let Some(pos) = resp.interact_pointer_pos() {
                                              let norm = ((pos.x - frame_rect.left()) / frame_rect.width())
                                                  .clamp(0.0, 1.0);
                                              self.project.source_playhead_frame =
                                                  (norm * (asset.duration_frames as f32)).round() as i64;
                                          }
                                      }

                                      // Source Scrubber Bar with In/Out Brackets
                                      let (scrub_rect, scrub_resp) = ui.allocate_exact_size(
                                          Vec2::new(ui.available_width(), 18.0),
                                          Sense::click_and_drag(),
                                      );
                                      ui.painter().rect_filled(
                                          scrub_rect,
                                          3.0,
                                          Color32::from_rgb(26, 29, 36),
                                      );
                                      let dur = asset.duration_frames.max(1) as f32;
                                      let in_x = scrub_rect.left()
                                          + (asset.in_point as f32 / dur) * scrub_rect.width();
                                      let out_x = scrub_rect.left()
                                          + (asset.out_point as f32 / dur) * scrub_rect.width();
                                      ui.painter().rect_filled(
                                          Rect::from_min_max(
                                              Pos2::new(in_x, scrub_rect.top()),
                                              Pos2::new(out_x, scrub_rect.bottom()),
                                          ),
                                          2.0,
                                          Color32::from_rgba_unmultiplied(56, 189, 248, 70),
                                      );
                                      let ph_x = scrub_rect.left()
                                          + (self.project.source_playhead_frame as f32 / dur)
                                              * scrub_rect.width();
                                      ui.painter().line_segment(
                                          [
                                              Pos2::new(ph_x, scrub_rect.top()),
                                              Pos2::new(ph_x, scrub_rect.bottom()),
                                          ],
                                          Stroke::new(2.0, Color32::from_rgb(56, 189, 248)),
                                      );
                                      if scrub_resp.clicked() || scrub_resp.dragged() {
                                          if let Some(p) = scrub_resp.interact_pointer_pos() {
                                              let n = ((p.x - scrub_rect.left()) / scrub_rect.width())
                                                  .clamp(0.0, 1.0);
                                              self.project.source_playhead_frame = (n * dur).round() as i64;
                                          }
                                      }

                                      // Source Transport & Three-Point Edit Buttons
                                      ui.horizontal(|ui| {
                                          let play_lbl = if self.source_is_playing { "⏸" } else { "▶" };
                                          if ui.button(play_lbl).clicked() {
                                              self.source_is_playing = !self.source_is_playing;
                                          }
                                          if ui.small_button("{ Set In").clicked() {
                                              if let Some(a) = self
                                                  .project
                                                  .assets
                                                  .iter_mut()
                                                  .find(|a| a.id == asset.id)
                                              {
                                                  a.in_point = self.project.source_playhead_frame;
                                              }
                                          }
                                          if ui.small_button("Set Out }").clicked() {
                                              if let Some(a) = self
                                                  .project
                                                  .assets
                                                  .iter_mut()
                                                  .find(|a| a.id == asset.id)
                                              {
                                                  a.out_point = (self.project.source_playhead_frame + 1)
                                                      .max(a.in_point + 1);
                                              }
                                          }
                                          ui.separator();
                                          if ui.small_button("⇩ Insert (,)").clicked() {
                                              self.insert_from_source();
                                          }
                                          if ui.small_button("⇩ Overwrite (.)").clicked() {
                                              self.overwrite_from_source();
                                          }
                                      });
                                  }
                              });
                      });

                      // ----------------------------------------------------------------
                      // RIGHT: PROGRAM MONITOR & LIVE VIDEO SCOPES
                      // ----------------------------------------------------------------
                      ui.allocate_ui(Vec2::new(half_w, avail_h), |ui| {
                          egui::Frame::NONE
                              .fill(Color32::from_rgb(17, 19, 24))
                              .corner_radius(CornerRadius::same(6))
                              .inner_margin(egui::Margin::same(8))
                              .stroke(Stroke::new(1.0, Color32::from_rgb(40, 44, 54)))
                              .show(ui, |ui| {
                                  ui.horizontal(|ui| {
                                      ui.strong("PROGRAM MONITOR");
                                      egui::ComboBox::from_id_salt("scope_mode_combo")
                                          .selected_text(match self.monitor_scope {
                                              MonitorScopeMode::ProgramComposite => "Composite Video",
                                              MonitorScopeMode::LumaWaveform => "Scope: Luma Waveform",
                                              MonitorScopeMode::RgbParade => "Scope: RGB Parade",
                                              MonitorScopeMode::Vectorscope => "Scope: Vectorscope",
                                          })
                                          .show_ui(ui, |ui| {
                                              ui.selectable_value(
                                                  &mut self.monitor_scope,
                                                  MonitorScopeMode::ProgramComposite,
                                                  "Composite Video",
                                              );
                                              ui.selectable_value(
                                                  &mut self.monitor_scope,
                                                  MonitorScopeMode::LumaWaveform,
                                                  "Scope: Luma Waveform (IRE)",
                                              );
                                              ui.selectable_value(
                                                  &mut self.monitor_scope,
                                                  MonitorScopeMode::RgbParade,
                                                  "Scope: RGB Parade",
                                              );
                                              ui.selectable_value(
                                                  &mut self.monitor_scope,
                                                  MonitorScopeMode::Vectorscope,
                                                  "Scope: YUV Vectorscope",
                                              );
                                          });

                                      ui.with_layout(
                                          egui::Layout::right_to_left(egui::Align::Center),
                                          |ui| {
                                              let tc = frames_to_smpte(
                                                  self.project.playhead_frame,
                                                  self.project.fps,
                                                  self.project.drop_frame,
                                              );
                                              ui.monospace(
                                                  RichText::new(tc)
                                                      .strong()
                                                      .color(Color32::from_rgb(251, 191, 36)),
                                              );
                                          },
                                      );
                                  });

                                  let (prog_img, float_samples) = self.synthesize_program_frame(256, 144);
                                  let tex = self.program_texture.get_or_insert_with(|| {
                                      ctx.load_texture(
                                          "program_monitor_tex",
                                          prog_img.clone(),
                                          TextureOptions::LINEAR,
                                      )
                                  });
                                  tex.set(prog_img, TextureOptions::LINEAR);

                                  let canvas_h = (ui.available_height() - 62.0).max(110.0);
                                  let (viewport_rect, _) = ui.allocate_exact_size(
                                      Vec2::new(ui.available_width(), canvas_h),
                                      Sense::hover(),
                                  );
                                  ui.painter().rect_filled(
                                      viewport_rect,
                                      4.0,
                                      Color32::from_rgb(10, 11, 14),
                                  );

                                  let fit_w = viewport_rect.width().min(viewport_rect.height() * (16.0 / 9.0));
                                  let fit_h = fit_w * (9.0 / 16.0);
                                  let frame_rect =
                                      Rect::from_center_size(viewport_rect.center(), Vec2::new(fit_w, fit_h));

                                  match self.monitor_scope {
                                      MonitorScopeMode::ProgramComposite => {
                                          ui.painter().image(
                                              tex.id(),
                                              frame_rect,
                                              Rect::from_min_max(Pos2::ZERO, Pos2::new(1.0, 1.0)),
                                              Color32::WHITE,
                                          );
                                          self.draw_program_titles_and_captions(ui.painter(), frame_rect);
                                          if self.show_safe_margins {
                                              Self::draw_safe_margins(ui.painter(), frame_rect);
                                          }
                                          if self.show_thirds_grid {
                                              Self::draw_thirds_grid(ui.painter(), frame_rect);
                                          }
                                      }
                                      MonitorScopeMode::LumaWaveform => {
                                          Self::draw_luma_waveform_scope(
                                              ui.painter(),
                                              frame_rect,
                                              &float_samples,
                                              256,
                                              144,
                                          );
                                      }
                                      MonitorScopeMode::RgbParade => {
                                          Self::draw_rgb_parade_scope(
                                              ui.painter(),
                                              frame_rect,
                                              &float_samples,
                                              256,
                                              144,
                                          );
                                      }
                                      MonitorScopeMode::Vectorscope => {
                                          Self::draw_vectorscope(ui.painter(), frame_rect, &float_samples);
                                      }
                                  }

                                  // Program Scrubber
                                  let max_f = self.project.sequence_duration_frames().max(1) as f32;
                                  let (scrub_rect, scrub_resp) = ui.allocate_exact_size(
                                      Vec2::new(ui.available_width(), 18.0),
                                      Sense::click_and_drag(),
                                  );
                                  ui.painter().rect_filled(
                                      scrub_rect,
                                      3.0,
                                      Color32::from_rgb(26, 29, 36),
                                  );
                                  let ph_x = scrub_rect.left()
                                      + (self.project.playhead_frame as f32 / max_f) * scrub_rect.width();
                                  ui.painter().line_segment(
                                      [
                                          Pos2::new(ph_x, scrub_rect.top()),
                                          Pos2::new(ph_x, scrub_rect.bottom()),
                                      ],
                                      Stroke::new(2.0, Color32::from_rgb(251, 191, 36)),
                                  );
                                  if scrub_resp.clicked() || scrub_resp.dragged() {
                                      if let Some(p) = scrub_resp.interact_pointer_pos() {
                                          let n = ((p.x - scrub_rect.left()) / scrub_rect.width())
                                              .clamp(0.0, 1.0);
                                          self.project.playhead_frame = (n * max_f).round() as i64;
                                      }
                                  }

                                  // Program Transport Bar
                                  ui.horizontal(|ui| {
                                      if ui.small_button("⏮").clicked() {
                                          self.project.playhead_frame = 0;
                                      }
                                      if ui.small_button("◀ 1f").clicked() {
                                          self.execute_shortcut_action(ShortcutAction::StepBackFrame);
                                      }
                                      let play_text = if self.is_playing {
                                          format!("⏸ {:.0}x", self.shuttle_speed)
                                      } else {
                                          "▶ Play (Space)".to_string()
                                      };
                                      if ui.button(play_text).clicked() {
                                          self.execute_shortcut_action(ShortcutAction::PlayPause);
                                      }
                                      if ui.small_button("1f ▶").clicked() {
                                          self.execute_shortcut_action(ShortcutAction::StepForwardFrame);
                                      }
                                      ui.separator();
                                      ui.checkbox(&mut self.show_safe_margins, "Safe Margins");
                                      ui.checkbox(&mut self.show_thirds_grid, "Grid");
                                  });
                              });
                      });
                  });
              }

              fn draw_safe_margins(painter: &egui::Painter, rect: Rect) {
                  let action_safe = rect.shrink2(rect.size() * 0.05);
                  let title_safe = rect.shrink2(rect.size() * 0.10);
                  painter.rect_stroke(
                      action_safe,
                      0.0,
                      Stroke::new(1.0, Color32::from_rgba_unmultiplied(255, 255, 255, 65)),
                      StrokeKind::Inside,
                  );
                  painter.rect_stroke(
                      title_safe,
                      0.0,
                      Stroke::new(1.0, Color32::from_rgba_unmultiplied(56, 189, 248, 75)),
                      StrokeKind::Inside,
                  );
              }

              fn draw_thirds_grid(painter: &egui::Painter, rect: Rect) {
                  let stroke = Stroke::new(1.0, Color32::from_rgba_unmultiplied(255, 255, 255, 55));
                  for i in 1..=2 {
                      let f = (i as f32) / 3.0;
                      let x = rect.left() + rect.width() * f;
                      let y = rect.top() + rect.height() * f;
                      painter.line_segment([Pos2::new(x, rect.top()), Pos2::new(x, rect.bottom())], stroke);
                      painter.line_segment([Pos2::new(rect.left(), y), Pos2::new(rect.right(), y)], stroke);
                  }
              }

              fn draw_program_titles_and_captions(&self, painter: &egui::Painter, frame_rect: Rect) {
                  let playhead = self.project.playhead_frame;

                  // 1. Active Title Overlays
                  for clip in &self.project.clips {
                      if clip.enabled
                          && playhead >= clip.timeline_start
                          && playhead < clip.timeline_end()
                      {
                          if let Some(title) = &clip.title_overlay {
                              let x = frame_rect.left() + frame_rect.width() * title.pos_x_norm;
                              let y = frame_rect.top() + frame_rect.height() * title.pos_y_norm;
                              let box_rect = Rect::from_min_size(
                                  Pos2::new(x, y),
                                  Vec2::new(frame_rect.width() * 0.68, 42.0),
                              );
                              painter.rect_filled(
                                  box_rect,
                                  4.0,
                                  Color32::from_rgba_unmultiplied(
                                      12,
                                      15,
                                      22,
                                      (title.box_opacity * 230.0) as u8,
                                  ),
                              );
                              if title.lower_third_style {
                                  painter.rect_filled(
                                      Rect::from_min_size(box_rect.min, Vec2::new(4.0, box_rect.height())),
                                      2.0,
                                      Color32::from_rgb(
                                          title.accent_color[0],
                                          title.accent_color[1],
                                          title.accent_color[2],
                                      ),
                                  );
                              }
                              painter.text(
                                  Pos2::new(box_rect.left() + 12.0, box_rect.top() + 6.0),
                                  egui::Align2::LEFT_TOP,
                                  &title.headline,
                                  FontId::new(13.0, FontFamily::Proportional),
                                  Color32::from_rgb(
                                      title.text_color[0],
                                      title.text_color[1],
                                      title.text_color[2],
                                  ),
                              );
                              painter.text(
                                  Pos2::new(box_rect.left() + 12.0, box_rect.top() + 23.0),
                                  egui::Align2::LEFT_TOP,
                                  &title.subtitle,
                                  FontId::new(10.5, FontFamily::Proportional),
                                  Color32::from_rgb(148, 163, 184),
                              );
                          }
                      }
                  }

                  // 2. Active Closed Captions
                  for cap in &self.project.captions {
                      if cap.enabled && playhead >= cap.start_frame && playhead <= cap.end_frame {
                          let cc_center = Pos2::new(frame_rect.center().x, frame_rect.bottom() - 18.0);
                          let text = format!("{}: {}", cap.speaker, cap.text);
                          let cc_rect = Rect::from_center_size(
                              cc_center,
                              Vec2::new((frame_rect.width() * 0.86).min(460.0), 22.0),
                          );
                          painter.rect_filled(
                              cc_rect,
                              3.0,
                              Color32::from_rgba_unmultiplied(8, 10, 14, 215),
                          );
                          painter.text(
                              cc_center,
                              egui::Align2::CENTER_CENTER,
                              text,
                              FontId::new(11.0, FontFamily::Proportional),
                              Color32::from_rgb(248, 250, 252),
                          );
                      }
                  }
              }

              fn draw_luma_waveform_scope(
                  painter: &egui::Painter,
                  rect: Rect,
                  samples: &[[f32; 3]],
                  w: usize,
                  h: usize,
              ) {
                  painter.rect_filled(rect, 4.0, Color32::from_rgb(8, 10, 14));
                  for ire in [0.0_f32, 0.25, 0.5, 0.75, 1.0] {
                      let y = rect.bottom() - ire * rect.height();
                      painter.line_segment(
                          [Pos2::new(rect.left(), y), Pos2::new(rect.right(), y)],
                          Stroke::new(1.0, Color32::from_rgba_unmultiplied(255, 255, 255, 28)),
                      );
                  }
                  for x in (0..w).step_by(2) {
                      let px = rect.left() + (x as f32 / w as f32) * rect.width();
                      for y in (0..h).step_by(3) {
                          let rgb = samples[y * w + x];
                          let luma = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]).clamp(0.0, 1.0);
                          let py = rect.bottom() - luma * rect.height();
                          painter.circle_filled(
                              Pos2::new(px, py),
                              1.2,
                              Color32::from_rgba_unmultiplied(74, 222, 128, 95),
                          );
                      }
                  }
              }

              fn draw_rgb_parade_scope(
                  painter: &egui::Painter,
                  rect: Rect,
                  samples: &[[f32; 3]],
                  w: usize,
                  h: usize,
              ) {
                  painter.rect_filled(rect, 4.0, Color32::from_rgb(8, 10, 14));
                  let band_w = rect.width() / 3.0;
                  let colors = [
                      Color32::from_rgba_unmultiplied(248, 113, 113, 95),
                      Color32::from_rgba_unmultiplied(74, 222, 128, 95),
                      Color32::from_rgba_unmultiplied(56, 189, 248, 95),
                  ];
                  for ch in 0..3 {
                      let x_base = rect.left() + (ch as f32) * band_w;
                      for x in (0..w).step_by(4) {
                          let px = x_base + (x as f32 / w as f32) * (band_w - 4.0);
                          for y in (0..h).step_by(4) {
                              let val = samples[y * w + x][ch].clamp(0.0, 1.0);
                              let py = rect.bottom() - val * rect.height();
                              painter.circle_filled(Pos2::new(px, py), 1.1, colors[ch]);
                          }
                      }
                  }
              }

              fn draw_vectorscope(painter: &egui::Painter, rect: Rect, samples: &[[f32; 3]]) {
                  painter.rect_filled(rect, 4.0, Color32::from_rgb(8, 10, 14));
                  let center = rect.center();
                  let radius = rect.height().min(rect.width()) * 0.43;
                  painter.circle_stroke(
                      center,
                      radius,
                      Stroke::new(1.0, Color32::from_rgba_unmultiplied(255, 255, 255, 45)),
                  );
                  painter.circle_stroke(
                      center,
                      radius * 0.5,
                      Stroke::new(1.0, Color32::from_rgba_unmultiplied(255, 255, 255, 25)),
                  );
                  for rgb in samples.iter().step_by(9) {
                      let y = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
                      let cb = (rgb[2] - y) * 0.564;
                      let cr = (rgb[0] - y) * 0.713;
                      let pt = Pos2::new(center.x + cb * radius * 1.6, center.y - cr * radius * 1.6);
                      painter.circle_filled(
                          pt,
                          1.2,
                          Color32::from_rgba_unmultiplied(250, 204, 21, 90),
                      );
                  }
              }

              // ========================================================================
              // 14. MULTI-TRACK TIMELINE, TOOL PALETTE & PRECISION TRIMMING INTERACTION
              // ========================================================================

              fn render_timeline_panel(&mut self, ui: &mut Ui) {
                  // Timeline Toolbar (Tools, Snapping, Zoom, Razor, Ripple Delete, Markers)
                  ui.horizontal(|ui| {
                      for tool in [
                          EditTool::Selection,
                          EditTool::TrackSelectForward,
                          EditTool::RippleEdit,
                          EditTool::RollEdit,
                          EditTool::Razor,
                          EditTool::Slip,
                          EditTool::Slide,
                      ] {
                          let active = self.active_tool == tool;
                          if ui
                              .selectable_label(active, tool.short_badge())
                              .on_hover_text(tool.label())
                              .clicked()
                          {
                              self.active_tool = tool;
                          }
                      }

                      ui.separator();
                      ui.toggle_value(&mut self.snap_enabled, "🧲 Snap [S]");
                      ui.toggle_value(&mut self.linked_selection, "🔗 Linked V+A");
                      if ui.small_button("✂ Split Playhead [Ctrl+K]").clicked() {
                          self.razor_split_at(self.project.playhead_frame, None);
                      }
                      if ui.small_button("⌫ Ripple Delete [Shift+Del]").clicked() {
                          self.ripple_delete_selected();
                      }
                      if ui.small_button("🚩 +Marker [M]").clicked() {
                          self.add_marker_at_playhead();
                      }

                      ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                          ui.add(
                              egui::Slider::new(&mut self.timeline_zoom_px_per_frame, 0.8..=12.0)
                                  .text("Zoom"),
                          );
                      });
                  });

                  ui.separator();

                  // Main Timeline Canvas (Left Header Column + Right Multi-Track Canvas)
                  let header_w = 185.0_f32;
                  let ruler_h = 28.0_f32;
                  let avail_size = ui.available_size();
                  let (timeline_rect, timeline_resp) =
                      ui.allocate_exact_size(avail_size, Sense::click_and_drag());

                  let painter = ui.painter_at(timeline_rect);
                  painter.rect_filled(timeline_rect, 0.0, Color32::from_rgb(16, 18, 23));

                  let canvas_left = timeline_rect.left() + header_w;
                  let pxf = self.timeline_zoom_px_per_frame;
                  let scroll_f = self.timeline_scroll_frames;
                  let frame_to_x = |f: i64| -> f32 { canvas_left + ((f as f32) - scroll_f) * pxf };
                  let x_to_frame =
                      |x: f32| -> i64 { (((x - canvas_left) / pxf) + scroll_f).round().max(0.0) as i64 };

                  // 1. Time Ruler & Work Area Bar
                  let ruler_rect = Rect::from_min_max(
                      Pos2::new(canvas_left, timeline_rect.top()),
                      Pos2::new(timeline_rect.right(), timeline_rect.top() + ruler_h),
                  );
                  painter.rect_filled(ruler_rect, 0.0, Color32::from_rgb(24, 27, 34));

                  if let (Some(in_f), Some(out_f)) = (self.project.sequence_in, self.project.sequence_out) {
                      if out_f > in_f {
                          let x0 = frame_to_x(in_f).max(canvas_left);
                          let x1 = frame_to_x(out_f).min(timeline_rect.right());
                          if x1 > x0 {
                              painter.rect_filled(
                                  Rect::from_min_max(
                                      Pos2::new(x0, ruler_rect.top()),
                                      Pos2::new(x1, ruler_rect.top() + 6.0),
                                  ),
                                  2.0,
                                  Color32::from_rgb(56, 189, 248),
                              );
                          }
                      }
                  }

                  // SMPTE ticks on ruler
                  let step_frames = if pxf > 5.0 {
                      12
                  } else if pxf > 2.0 {
                      24
                  } else {
                      48
                  };
                  let first_tick = ((scroll_f as i64) / step_frames) * step_frames;
                  let max_vis_frame = x_to_frame(timeline_rect.right()) + step_frames;
                  let mut f_tick = first_tick;
                  while f_tick <= max_vis_frame {
                      let x = frame_to_x(f_tick);
                      if x >= canvas_left && x <= timeline_rect.right() {
                          painter.line_segment(
                              [
                                  Pos2::new(x, ruler_rect.bottom() - 8.0),
                                  Pos2::new(x, ruler_rect.bottom()),
                              ],
                              Stroke::new(1.0, Color32::from_rgb(90, 98, 115)),
                          );
                          let tc = frames_to_smpte(f_tick, self.project.fps, self.project.drop_frame);
                          painter.text(
                              Pos2::new(x + 3.0, ruler_rect.top() + 7.0),
                              egui::Align2::LEFT_TOP,
                              tc,
                              FontId::new(10.0, FontFamily::Monospace),
                              Color32::from_rgb(165, 175, 195),
                          );
                      }
                      f_tick += step_frames;
                  }

                  // Sequence Markers on Ruler
                  let mut clicked_marker_frame = None;
                  for marker in &self.project.markers {
                      let mx = frame_to_x(marker.frame);
                      if mx >= canvas_left && mx <= timeline_rect.right() {
                          let m_rect = Rect::from_center_size(
                              Pos2::new(mx, ruler_rect.bottom() - 6.0),
                              Vec2::new(10.0, 10.0),
                          );
                          painter.rect_filled(m_rect, 2.0, marker.category.color());
                          if let Some(pos) = timeline_resp.interact_pointer_pos() {
                              if timeline_resp.clicked() && m_rect.expand(3.0).contains(pos) {
                                  clicked_marker_frame = Some((marker.id, marker.frame));
                              }
                          }
                      }
                  }
                  if let Some((mid, mframe)) = clicked_marker_frame {
                      self.selected_marker_id = Some(mid);
                      self.project.playhead_frame = mframe;
                  }

                  // 2. Track Rows & Track Headers
                  let mut y_cursor = timeline_rect.top() + ruler_h;
                  let mut track_y_ranges: Vec<(usize, f32, f32)> = Vec::new();

                  for t_idx in 0..self.project.tracks.len() {
                      let th = self.project.tracks[t_idx].height_px;
                      let row_top = y_cursor;
                      let row_bottom = (y_cursor + th).min(timeline_rect.bottom());
                      track_y_ranges.push((t_idx, row_top, row_bottom));

                      // Track Lane Background
                      let lane_rect = Rect::from_min_max(
                          Pos2::new(canvas_left, row_top),
                          Pos2::new(timeline_rect.right(), row_bottom),
                      );
                      let lane_bg = if self.project.tracks[t_idx].kind == TrackKind::Video {
                          Color32::from_rgb(20, 23, 29)
                      } else {
                          Color32::from_rgb(18, 24, 26)
                      };
                      painter.rect_filled(lane_rect, 0.0, lane_bg);
                      painter.line_segment(
                          [
                              Pos2::new(timeline_rect.left(), row_bottom),
                              Pos2::new(timeline_rect.right(), row_bottom),
                          ],
                          Stroke::new(1.0, Color32::from_rgb(35, 39, 48)),
                      );

                      // Track Header Controls
                      let hdr_rect = Rect::from_min_max(
                          Pos2::new(timeline_rect.left(), row_top),
                          Pos2::new(canvas_left - 2.0, row_bottom),
                      );
                      painter.rect_filled(hdr_rect, 0.0, Color32::from_rgb(27, 30, 38));

                      let mut child_ui = ui.new_child(
                          egui::UiBuilder::new()
                              .max_rect(hdr_rect.shrink(4.0))
                              .layout(egui::Layout::left_to_right(egui::Align::Center)),
                      );
                      let track = &mut self.project.tracks[t_idx];
                      let target_lbl = if track.kind == TrackKind::Video {
                          "V"
                      } else {
                          "A"
                      };
                      if child_ui
                          .selectable_label(track.target_enabled, target_lbl)
                          .on_hover_text("Target Track for Insert/Overwrite")
                          .clicked()
                      {
                          track.target_enabled = !track.target_enabled;
                      }
                      if child_ui
                          .selectable_label(track.locked, "🔒")
                          .on_hover_text("Lock Track")
                          .clicked()
                      {
                          track.locked = !track.locked;
                      }
                      let vis_icon = if track.kind == TrackKind::Video {
                          "👁"
                      } else {
                          "M"
                      };
                      if child_ui
                          .selectable_label(!track.visible_or_unmuted, vis_icon)
                          .on_hover_text("Toggle Track Visibility / Mute")
                          .clicked()
                      {
                          track.visible_or_unmuted = !track.visible_or_unmuted;
                      }
                      if track.kind == TrackKind::Audio
                          && child_ui
                              .selectable_label(track.solo, "S")
                              .on_hover_text("Solo Audio Track")
                              .clicked()
                      {
                          track.solo = !track.solo;
                      }
                      child_ui.small(&track.name);

                      y_cursor += th;
                  }

                  // 3. Render Clips on Timeline
                  let mut clip_rects: Vec<(u64, usize, Rect, i64, i64, i64)> = Vec::new();
                  for clip in &self.project.clips {
                      let Some((_, r_top, r_bot)) = track_y_ranges
                          .iter()
                          .find(|(idx, _, _)| *idx == clip.track_index)
                      else {
                          continue;
                      };
                      let x0 = frame_to_x(clip.timeline_start);
                      let x1 = frame_to_x(clip.timeline_end());
                      if x1 < canvas_left || x0 > timeline_rect.right() {
                          continue;
                      }
                      let c_rect = Rect::from_min_max(
                          Pos2::new(x0.max(canvas_left), *r_top + 3.0),
                          Pos2::new(x1.min(timeline_rect.right()), *r_bot - 3.0),
                      );
                      clip_rects.push((
                          clip.id,
                          clip.track_index,
                          c_rect,
                          clip.timeline_start,
                          clip.duration,
                          clip.source_in,
                      ));

                      let is_selected = self.selected_clip_id == Some(clip.id);
                      let base_col = Color32::from_rgb(clip.color_tag[0], clip.color_tag[1], clip.color_tag[2]);
                      painter.rect_filled(c_rect, 4.0, base_col);

                      // Top highlight bar
                      painter.rect_filled(
                          Rect::from_min_max(
                              c_rect.min,
                              Pos2::new(c_rect.right(), (c_rect.top() + 14.0).min(c_rect.bottom())),
                          ),
                          4.0,
                          Color32::from_rgba_unmultiplied(0, 0, 0, 75),
                      );

                      // Waveform preview on Audio tracks
                      if clip.track_index >= 3 {
                          if let Some(asset) = self.project.assets.iter().find(|a| a.id == clip.asset_id) {
                              if !asset.waveform_peaks.is_empty() {
                                  let n_bars = ((c_rect.width() / 4.0) as usize).clamp(2, 96);
                                  for b_i in 0..n_bars {
                                      let pk = asset.waveform_peaks[b_i % asset.waveform_peaks.len()];
                                      let bx = c_rect.left() + (b_i as f32 / n_bars as f32) * c_rect.width();
                                      let bh = (c_rect.height() - 16.0).max(4.0) * pk;
                                      painter.line_segment(
                                          [
                                              Pos2::new(bx, c_rect.bottom() - 2.0),
                                              Pos2::new(bx, c_rect.bottom() - 2.0 - bh),
                                          ],
                                          Stroke::new(
                                              2.0,
                                              Color32::from_rgba_unmultiplied(167, 243, 208, 150),
                                          ),
                                      );
                                  }
                              }
                          }
                      }

                      // Clip Title & In/Out badges
                      if c_rect.width() > 36.0 {
                          painter.text(
                              Pos2::new(c_rect.left() + 6.0, c_rect.top() + 1.0),
                              egui::Align2::LEFT_TOP,
                              &clip.name,
                              FontId::new(10.5, FontFamily::Proportional),
                              Color32::WHITE,
                          );
                      }

                      // Transition badges
                      if clip.transition_in.is_some() {
                          painter.rect_filled(
                              Rect::from_min_size(c_rect.min, Vec2::new(12.0, c_rect.height())),
                              2.0,
                              Color32::from_rgba_unmultiplied(251, 191, 36, 160),
                          );
                      }
                      if clip.transition_out.is_some() {
                          painter.rect_filled(
                              Rect::from_min_size(
                                  Pos2::new(c_rect.right() - 12.0, c_rect.top()),
                                  Vec2::new(12.0, c_rect.height()),
                              ),
                              2.0,
                              Color32::from_rgba_unmultiplied(251, 191, 36, 160),
                          );
                      }

                      let border_stroke = if is_selected {
                          Stroke::new(2.0, Color32::WHITE)
                      } else {
                          Stroke::new(1.0, Color32::from_rgba_unmultiplied(15, 18, 24, 200))
                      };
                      painter.rect_stroke(c_rect, 4.0, border_stroke, StrokeKind::Inside);
                  }

                  // 4. Playhead Vertical Line across Ruler & Tracks
                  let ph_x = frame_to_x(self.project.playhead_frame);
                  if ph_x >= canvas_left && ph_x <= timeline_rect.right() {
                      painter.line_segment(
                          [
                              Pos2::new(ph_x, timeline_rect.top()),
                              Pos2::new(ph_x, timeline_rect.bottom()),
                          ],
                          Stroke::new(2.0, Color32::from_rgb(239, 68, 68)),
                      );
                      painter.circle_filled(
                          Pos2::new(ph_x, ruler_rect.top() + 8.0),
                          5.0,
                          Color32::from_rgb(239, 68, 68),
                      );
                  }

                  // 5. Interactive Pointer Handling for Scrubbing, Razor, Selection, Ripple, Roll, Slip & Slide
                  self.handle_timeline_pointer_interactions(
                      &timeline_resp,
                      ruler_rect,
                      &clip_rects,
                      &x_to_frame,
                  );
              }

              fn handle_timeline_pointer_interactions(
                  &mut self,
                  resp: &egui::Response,
                  ruler_rect: Rect,
                  clip_rects: &[(u64, usize, Rect, i64, i64, i64)],
                  x_to_frame: &dyn Fn(f32) -> i64,
              ) {
                  let Some(pointer_pos) = resp.interact_pointer_pos() else {
                      if resp.drag_stopped() && !matches!(self.drag_mode, DragMode::None) {
                          let mode = self.drag_mode;
                          self.drag_mode = DragMode::None;
                          if !matches!(mode, DragMode::ScrubTimeline | DragMode::ScrubSource) {
                              self.commit_snapshot(format!("Timeline {}", self.active_tool.label()));
                          }
                      }
                      return;
                  };

                  let hover_frame = x_to_frame(pointer_pos.x);

                  // Single click with Razor Tool or Track Select Forward
                  if resp.clicked() {
                      if ruler_rect.contains(pointer_pos) {
                          self.project.playhead_frame = hover_frame;
                          return;
                      }
                      for (cid, t_idx, rect, start_f, _, _) in clip_rects {
                          if rect.contains(pointer_pos) {
                              self.selected_clip_id = Some(*cid);
                              if self.active_tool == EditTool::Razor {
                                  self.razor_split_at(hover_frame, Some(*cid));
                                  return;
                              }
                              if self.active_tool == EditTool::TrackSelectForward {
                                  let shift_delta = 12;
                                  for c in &mut self.project.clips {
                                      let unlocked = self
                                          .project
                                          .tracks
                                          .get(c.track_index)
                                          .map(|t| !t.locked)
                                          .unwrap_or(false);
                                      if unlocked && c.timeline_start >= *start_f {
                                          c.timeline_start += shift_delta;
                                      }
                                  }
                                  self.commit_snapshot("Track Select Forward Shift (+12f)");
                                  return;
                              }
                              let _ = t_idx;
                              break;
                          }
                      }
                  }

                  // Initiate drag
                  if resp.drag_started() {
                      if ruler_rect.contains(pointer_pos) {
                          self.drag_mode = DragMode::ScrubTimeline;
                          self.project.playhead_frame = hover_frame;
                          return;
                      }

                      let edge_px = 9.0;
                      for (cid, t_idx, rect, start_f, dur_f, src_in) in clip_rects {
                          if !rect.contains(pointer_pos) {
                              continue;
                          }
                          if self
                              .project
                              .tracks
                              .get(*t_idx)
                              .map(|t| t.locked)
                              .unwrap_or(false)
                          {
                              break;
                          }
                          self.selected_clip_id = Some(*cid);
                          let near_left = (pointer_pos.x - rect.left()).abs() <= edge_px;
                          let near_right = (pointer_pos.x - rect.right()).abs() <= edge_px;

                          match self.active_tool {
                              EditTool::RollEdit if near_left || near_right => {
                                  let cut_frame = if near_left {
                                      *start_f
                                  } else {
                                      *start_f + *dur_f
                                  };
                                  let left_c = self
                                      .project
                                      .clips
                                      .iter()
                                      .find(|c| c.track_index == *t_idx && c.timeline_end() == cut_frame)
                                      .map(|c| c.id);
                                  let right_c = self
                                      .project
                                      .clips
                                      .iter()
                                      .find(|c| c.track_index == *t_idx && c.timeline_start == cut_frame)
                                      .map(|c| c.id);
                                  if let (Some(l_id), Some(r_id)) = (left_c, right_c) {
                                      self.drag_mode = DragMode::RollEdit {
                                          left_clip_id: l_id,
                                          right_clip_id: r_id,
                                          initial_cut_frame: cut_frame,
                                      };
                                      return;
                                  }
                              }
                              EditTool::Slip => {
                                  self.drag_mode = DragMode::SlipClip {
                                      clip_id: *cid,
                                      initial_source_in: *src_in,
                                      grab_frame: hover_frame,
                                  };
                                  return;
                              }
                              EditTool::Slide => {
                                  let left_n = self
                                      .project
                                      .clips
                                      .iter()
                                      .find(|c| c.track_index == *t_idx && c.timeline_end() == *start_f)
                                      .map(|c| c.id);
                                  let right_n = self
                                      .project
                                      .clips
                                      .iter()
                                      .find(|c| {
                                          c.track_index == *t_idx && c.timeline_start == *start_f + *dur_f
                                      })
                                      .map(|c| c.id);
                                  self.drag_mode = DragMode::SlideClip {
                                      clip_id: *cid,
                                      left_neighbor_id: left_n,
                                      right_neighbor_id: right_n,
                                      initial_start: *start_f,
                                      grab_frame: hover_frame,
                                  };
                                  return;
                              }
                              _ => {
                                  let is_ripple = self.active_tool == EditTool::RippleEdit;
                                  if near_left {
                                      self.drag_mode = DragMode::TrimLeft {
                                          clip_id: *cid,
                                          initial_start: *start_f,
                                          initial_duration: *dur_f,
                                          initial_source_in: *src_in,
                                          ripple: is_ripple,
                                      };
                                  } else if near_right {
                                      self.drag_mode = DragMode::TrimRight {
                                          clip_id: *cid,
                                          initial_duration: *dur_f,
                                          ripple: is_ripple,
                                      };
                                  } else {
                                      self.drag_mode = DragMode::MoveClip {
                                          clip_id: *cid,
                                          grab_offset_frames: hover_frame - *start_f,
                                          initial_start: *start_f,
                                      };
                                  }
                                  return;
                              }
                          }
                      }
                  }

                  // Update active drag
                  if resp.dragged() {
                      match self.drag_mode {
                          DragMode::None | DragMode::ScrubSource => {}
                          DragMode::ScrubTimeline => {
                              self.project.playhead_frame = hover_frame;
                          }
                          DragMode::MoveClip {
                              clip_id,
                              grab_offset_frames,
                              initial_start,
                          } => {
                              let raw_new_start = (hover_frame - grab_offset_frames).max(0);
                              let snapped = self.snap_frame(raw_new_start, Some(clip_id));
                              if let Some(clip) = self.project.clips.iter_mut().find(|c| c.id == clip_id) {
                                  clip.timeline_start = snapped;
                                  let linked = clip.linked_clip_id;
                                  let delta = snapped - initial_start;
                                  let _ = delta;
                                  if self.linked_selection {
                                      if let Some(l_id) = linked {
                                          if let Some(lc) =
                                              self.project.clips.iter_mut().find(|c| c.id == l_id)
                                          {
                                              lc.timeline_start = snapped;
                                          }
                                      }
                                  }
                              }
                          }
                          DragMode::TrimLeft {
                              clip_id,
                              initial_start,
                              initial_duration,
                              initial_source_in,
                              ripple,
                          } => {
                              let snapped = self
                                  .snap_frame(hover_frame, Some(clip_id))
                                  .clamp(0, initial_start + initial_duration - 4);
                              let delta = snapped - initial_start;
                              let new_dur = (initial_duration - delta).max(4);
                              if let Some(clip) = self.project.clips.iter_mut().find(|c| c.id == clip_id) {
                                  let old_dur = clip.duration;
                                  let t_idx = clip.track_index;
                                  let c_end = clip.timeline_end();
                                  clip.duration = new_dur;
                                  clip.source_in = (initial_source_in + delta).max(0);
                                  if !ripple {
                                      clip.timeline_start = snapped;
                                  } else {
                                      let diff = new_dur - old_dur;
                                      for other in &mut self.project.clips {
                                          if other.id != clip_id
                                              && other.track_index == t_idx
                                              && other.timeline_start >= c_end - diff
                                          {
                                              other.timeline_start = (other.timeline_start + diff).max(0);
                                          }
                                      }
                                  }
                              }
                          }
                          DragMode::TrimRight {
                              clip_id,
                              initial_duration,
                              ripple,
                          } => {
                              if let Some(clip) = self.project.clips.iter().find(|c| c.id == clip_id).cloned()
                              {
                                  let snapped_end = self
                                      .snap_frame(hover_frame, Some(clip_id))
                                      .max(clip.timeline_start + 4);
                                  let new_dur = snapped_end - clip.timeline_start;
                                  let diff = new_dur - clip.duration;
                                  let _ = initial_duration;
                                  if let Some(c_mut) =
                                      self.project.clips.iter_mut().find(|c| c.id == clip_id)
                                  {
                                      c_mut.duration = new_dur;
                                  }
                                  if ripple && diff != 0 {
                                      for other in &mut self.project.clips {
                                          if other.id != clip_id
                                              && other.track_index == clip.track_index
                                              && other.timeline_start >= clip.timeline_end()
                                          {
                                              other.timeline_start = (other.timeline_start + diff).max(0);
                                          }
                                      }
                                  }
                              }
                          }
                          DragMode::RollEdit {
                              left_clip_id,
                              right_clip_id,
                              initial_cut_frame,
                          } => {
                              let delta = hover_frame - initial_cut_frame;
                              let left_start = self
                                  .project
                                  .clips
                                  .iter()
                                  .find(|c| c.id == left_clip_id)
                                  .map(|c| c.timeline_start)
                                  .unwrap_or(0);
                              let right_end = self
                                  .project
                                  .clips
                                  .iter()
                                  .find(|c| c.id == right_clip_id)
                                  .map(|c| c.timeline_end())
                                  .unwrap_or(100);
                              let new_cut = (initial_cut_frame + delta).clamp(left_start + 4, right_end - 4);
                              if let Some(lc) = self
                                  .project
                                  .clips
                                  .iter_mut()
                                  .find(|c| c.id == left_clip_id)
                              {
                                  lc.duration = new_cut - lc.timeline_start;
                              }
                              if let Some(rc) = self
                                  .project
                                  .clips
                                  .iter_mut()
                                  .find(|c| c.id == right_clip_id)
                              {
                                  let shift = new_cut - rc.timeline_start;
                                  rc.timeline_start = new_cut;
                                  rc.duration = right_end - new_cut;
                                  rc.source_in = (rc.source_in + shift).max(0);
                              }
                          }
                          DragMode::SlipClip {
                              clip_id,
                              initial_source_in,
                              grab_frame,
                          } => {
                              let delta = hover_frame - grab_frame;
                              if let Some(clip) = self.project.clips.iter_mut().find(|c| c.id == clip_id) {
                                  clip.source_in = (initial_source_in - delta).max(0);
                              }
                          }
                          DragMode::SlideClip {
                              clip_id,
                              left_neighbor_id,
                              right_neighbor_id,
                              initial_start,
                              grab_frame,
                          } => {
                              let delta = hover_frame - grab_frame;
                              let new_start = (initial_start + delta).max(4);
                              if let Some(clip) = self.project.clips.iter().find(|c| c.id == clip_id).cloned()
                              {
                                  let step = new_start - clip.timeline_start;
                                  if let Some(c_mut) =
                                      self.project.clips.iter_mut().find(|c| c.id == clip_id)
                                  {
                                      c_mut.timeline_start = new_start;
                                  }
                                  if let Some(lid) = left_neighbor_id {
                                      if let Some(lc) = self.project.clips.iter_mut().find(|c| c.id == lid) {
                                          lc.duration = (lc.duration + step).max(4);
                                      }
                                  }
                                  if let Some(rid) = right_neighbor_id {
                                      if let Some(rc) = self.project.clips.iter_mut().find(|c| c.id == rid) {
                                          rc.timeline_start = (rc.timeline_start + step).max(0);
                                          rc.duration = (rc.duration - step).max(4);
                                          rc.source_in = (rc.source_in + step).max(0);
                                      }
                                  }
                              }
                          }
                      }
                  }

                  if resp.drag_stopped() && !matches!(self.drag_mode, DragMode::None) {
                      let mode = self.drag_mode;
                      self.drag_mode = DragMode::None;
                      if !matches!(mode, DragMode::ScrubTimeline | DragMode::ScrubSource) {
                          self.commit_snapshot(format!("Trim/Move ({})", self.active_tool.label()));
                      }
                  }
              }

              // ========================================================================
              // 15. MODALS (KEYBOARD SHORTCUTS, UNDO HISTORY, CRASH RECOVERY, EXPORT)
              // ========================================================================

              fn render_modals(&mut self, ctx: &egui::Context) {
                  // 1. Crash Recovery Modal Banner
                  if self.show_crash_recovery_banner {
                      egui::Window::new("⚠ Crash Recovery & Autosave Journal Detected")
                          .collapsible(false)
                          .resizable(false)
                          .anchor(egui::Align2::CENTER_CENTER, Vec2::ZERO)
                          .show(ctx, |ui| {
                              ui.label(
                                  RichText::new(
                                      "CutForge Pro detected an unclosed session lockfile (.cutforge.lock) and a newer autosave recovery snapshot.",
                                  )
                                  .strong(),
                              );
                              if let Some(rec) = &self.recovered_snapshot {
                                  ui.label(format!(
                                      "Recovered Project: {} • Sequence: {} ({} clips, {} markers)",
                                      rec.project_name,
                                      rec.sequence_name,
                                      rec.clips.len(),
                                      rec.markers.len()
                                  ));
                              }
                              ui.add_space(8.0);
                              ui.horizontal(|ui| {
                                  if ui
                                      .button(
                                          RichText::new("✔ Restore Recovered Session")
                                              .strong()
                                              .color(Color32::from_rgb(52, 211, 153)),
                                      )
                                      .clicked()
                                  {
                                      if let Some(rec) = self.recovered_snapshot.take() {
                                          self.project = rec;
                                          self.commit_snapshot("Restored Crash Recovery Journal");
                                      }
                                      self.show_crash_recovery_banner = false;
                                  }
                                  if ui.button("Discard & Keep Current Project").clicked() {
                                      self.show_crash_recovery_banner = false;
                                  }
                              });
                          });
                  }

                  // 2. Customizable Keyboard Shortcuts Modal (`Ctrl+Alt+K`)
                  if self.show_shortcuts_modal {
                      let mut open = self.show_shortcuts_modal;
                      egui::Window::new("⌨ Keyboard Shortcuts Customization")
                          .open(&mut open)
                          .default_size([680.0, 520.0])
                          .show(ctx, |ui| {
                              ui.horizontal(|ui| {
                                  ui.label("Industry NLE Preset:");
                                  if ui.button("Adobe Premiere Pro CC").clicked() {
                                      self.shortcuts = ShortcutProfile::premiere_pro_default();
                                  }
                                  if ui.button("DaVinci Resolve").clicked() {
                                      self.shortcuts = ShortcutProfile::davinci_resolve_preset();
                                  }
                                  if ui.button("Final Cut Pro X").clicked() {
                                      self.shortcuts = ShortcutProfile::final_cut_pro_preset();
                                  }
                              });

                              ui.horizontal(|ui| {
                                  ui.label("Filter Commands:");
                                  ui.text_edit_singleline(&mut self.shortcut_search_query);
                              });

                              let conflicts = self.shortcuts.find_conflicts();
                              if !conflicts.is_empty() {
                                  for (a1, a2, key_str) in conflicts {
                                      ui.colored_label(
                                          Color32::from_rgb(248, 113, 113),
                                          format!(
                                              "⚠ Shortcut Conflict on [{}]: '{}' and '{}'",
                                              key_str,
                                              a1.label(),
                                              a2.label()
                                          ),
                                      );
                                  }
                              }

                              if let Some(rebinding) = self.rebinding_action {
                                  ui.colored_label(
                                      Color32::from_rgb(56, 189, 248),
                                      format!(
                                          "Press any key combination to bind '{}' (or Esc to cancel)...",
                                          rebinding.label()
                                      ),
                                  );
                              }

                              ui.separator();

                              let q = self.shortcut_search_query.to_lowercase();
                              egui::ScrollArea::vertical()
                                  .max_height(360.0)
                                  .show(ui, |ui| {
                                      egui::Grid::new("shortcuts_grid")
                                          .striped(true)
                                          .num_columns(3)
                                          .min_col_width(160.0)
                                          .show(ui, |ui| {
                                              ui.strong("Command");
                                              ui.strong("Current Shortcut");
                                              ui.strong("Rebind");
                                              ui.end_row();

                                              for action in ShortcutAction::all() {
                                                  if !q.is_empty()
                                                      && !action.label().to_lowercase().contains(&q)
                                                  {
                                                      continue;
                                                  }
                                                  ui.label(action.label());
                                                  let bind_str = self
                                                      .shortcuts
                                                      .bindings
                                                      .get(action)
                                                      .map(|b| b.display())
                                                      .unwrap_or_else(|| "Unbound".to_string());
                                                  ui.monospace(
                                                      RichText::new(bind_str)
                                                          .color(Color32::from_rgb(251, 191, 36)),
                                                  );
                                                  let is_waiting = self.rebinding_action == Some(*action);
                                                  let btn_lbl = if is_waiting {
                                                      "Listening..."
                                                  } else {
                                                      "Rebind Key"
                                                  };
                                                  if ui.small_button(btn_lbl).clicked() {
                                                      self.rebinding_action = Some(*action);
                                                  }
                                                  ui.end_row();
                                              }
                                          });
                                  });
                          });
                      self.show_shortcuts_modal = open;
                  }

                  // 3. Undo / Redo History Window
                  if self.show_history_window {
                      let mut open = self.show_history_window;
                      egui::Window::new("↺ Transactional Undo / Redo History")
                          .open(&mut open)
                          .default_size([360.0, 420.0])
                          .show(ctx, |ui| {
                              ui.small("Click any historical state below to time-travel directly to that edit snapshot:");
                              ui.separator();
                              let mut jump_idx = None;
                              egui::ScrollArea::vertical().show(ui, |ui| {
                                  for (idx, entry) in self.undo_stack.entries.iter().enumerate() {
                                      let is_curr = idx == self.undo_stack.cursor;
                                      let txt = format!(
                                          "{:02}. [{}] {}",
                                          idx + 1,
                                          entry.timestamp_label,
                                          entry.label
                                      );
                                      if ui.selectable_label(is_curr, txt).clicked() {
                                          jump_idx = Some(idx);
                                      }
                                  }
                              });
                              if let Some(target_idx) = jump_idx {
                                  self.undo_stack.cursor = target_idx;
                                  self.project = self.undo_stack.entries[target_idx].state.clone();
                              }
                          });
                      self.show_history_window = open;
                  }

                  // 4. Export & Render Queue Modal (`Ctrl+M`)
                  if self.show_export_modal {
                      let mut open = self.show_export_modal;
                      egui::Window::new("🎬 Export Media & Render Queue (Ctrl+M)")
                          .open(&mut open)
                          .default_size([740.0, 560.0])
                          .show(ctx, |ui| {
                              ui.horizontal(|ui| {
                                  ui.label("Format & Delivery Preset:");
                                  egui::ComboBox::from_id_salt("export_preset_cb")
                                      .selected_text(self.export_preset.label())
                                      .show_ui(ui, |ui| {
                                          for p in ExportFormatPreset::all() {
                                              if ui
                                                  .selectable_value(&mut self.export_preset, *p, p.label())
                                                  .changed()
                                              {
                                                  self.export_output_path =
                                                      format!("CutForge_Master_Export.{}", p.extension());
                                              }
                                          }
                                      });
                              });

                              ui.horizontal(|ui| {
                                  ui.label("Hardware Acceleration:");
                                  egui::ComboBox::from_id_salt("export_hw_cb")
                                      .selected_text(self.export_hw_encoder.label())
                                      .show_ui(ui, |ui| {
                                          for hw in HardwareEncoder::all() {
                                              ui.selectable_value(&mut self.export_hw_encoder, *hw, hw.label());
                                          }
                                      });
                              });

                              ui.horizontal(|ui| {
                                  ui.label("Output Filename:");
                                  ui.text_edit_singleline(&mut self.export_output_path);
                              });

                              ui.horizontal(|ui| {
                                  ui.add(
                                      egui::Slider::new(&mut self.export_bitrate_mbps, 8.0..=120.0)
                                          .text("Target Bitrate (Mbps)"),
                                  );
                                  ui.checkbox(&mut self.export_burn_in_captions, "Burn-In Captions (.srt)");
                                  ui.checkbox(&mut self.export_use_in_out, "Render Sequence In/Out Range");
                              });

                              ui.separator();
                              ui.strong("Generated FFmpeg Filtergraph Pipeline:");
                              let ffmpeg_cmd = self.build_ffmpeg_export_command();
                              egui::ScrollArea::vertical()
                                  .id_salt("ffmpeg_preview_scroll")
                                  .max_height(130.0)
                                  .show(ui, |ui| {
                                      ui.code(&ffmpeg_cmd);
                                  });

                              ui.separator();
                              ui.horizontal(|ui| {
                                  if ui
                                      .button(
                                          RichText::new("▶ Start Master Render")
                                              .strong()
                                              .color(Color32::from_rgb(52, 211, 153)),
                                      )
                                      .clicked()
                                  {
                                      self.export_progress = Some(0.05);
                                      let srt_data = self.export_captions_srt();
                                      let vtt_data = self.export_captions_vtt();
                                      let edl_data = self.export_cmx3600_edl();
                                      #[cfg(not(target_arch = "wasm32"))]
                                      {
                                          let _ = std::fs::write("captions_export.srt", &srt_data);
                                          let _ = std::fs::write("captions_export.vtt", &vtt_data);
                                          let _ = std::fs::write("sequence_export.edl", &edl_data);
                                      }
                                      self.last_export_log = format!(
                                          "Exported sidecar captions ({} bytes SRT, {} bytes WebVTT) and CMX 3600 EDL ({} bytes). Rendering video master '{}'...",
                                          srt_data.len(),
                                          vtt_data.len(),
                                          edl_data.len(),
                                          self.export_output_path
                                      );
                                  }

                                  if ui.button("Export .SRT & .VTT Captions").clicked() {
                                      let srt = self.export_captions_srt();
                                      self.last_export_log = format!("Generated SubRip (.srt):\n\n{srt}");
                                  }

                                  if ui.button("Export CMX 3600 .EDL").clicked() {
                                      let edl = self.export_cmx3600_edl();
                                      self.last_export_log = format!("Generated CMX 3600 EDL:\n\n{edl}");
                                  }
                              });

                              if let Some(p) = self.export_progress {
                                  ui.add(
                                      egui::ProgressBar::new(p)
                                          .show_percentage()
                                          .text("Encoding multi-track sequence..."),
                                  );
                              }

                              if !self.last_export_log.is_empty() {
                                  egui::ScrollArea::vertical()
                                      .id_salt("export_log_scroll")
                                      .max_height(110.0)
                                      .show(ui, |ui| {
                                          ui.monospace(&self.last_export_log);
                                      });
                              }
                          });
                      self.show_export_modal = open;
                  }
              }
          }

          // ============================================================================
          // 16. EFRAME::APP TRAIT IMPLEMENTATION & REAL-TIME LOOP
          // ============================================================================

          impl Drop for CutForgeApp {
              fn drop(&mut self) {
                  #[cfg(not(target_arch = "wasm32"))]
                  {
                      let _ = std::fs::remove_file(NATIVE_LOCKFILE_PATH);
                  }
              }
          }

          impl eframe::App for CutForgeApp {
              fn save(&mut self, storage: &mut dyn eframe::Storage) {
                  if let Ok(sc_json) = serde_json::to_string(&self.shortcuts) {
                      storage.set_string(SHORTCUTS_STORAGE_KEY, sc_json);
                  }
                  self.perform_autosave(Some(storage));
              }



              fn ui(&mut self, ui: &mut egui::Ui, frame: &mut eframe::Frame) {
                  let ctx = ui.ctx().clone();
                  let now = Instant::now();
                  let dt = now.duration_since(self.last_tick).as_secs_f64().min(0.1);
                  self.last_tick = now;

                  // 1. Advance Program & Source playback transports
                  if self.is_playing {
                      self.frame_accumulator += dt * self.project.fps * (self.shuttle_speed as f64);
                      let step = self.frame_accumulator.trunc() as i64;
                      if step != 0 {
                          self.frame_accumulator -= step as f64;
                          let max_f = self.project.sequence_duration_frames();
                          let next = self.project.playhead_frame + step;
                          if next >= max_f {
                              self.project.playhead_frame = 0;
                          } else if next < 0 {
                              self.project.playhead_frame = 0;
                              self.is_playing = false;
                          } else {
                              self.project.playhead_frame = next;
                          }
                      }
                      ctx.request_repaint();
                  }

                  if self.source_is_playing {
                      self.source_frame_accumulator += dt * self.project.fps;
                      let step = self.source_frame_accumulator.trunc() as i64;
                      if step > 0 {
                          self.source_frame_accumulator -= step as f64;
                          let max_src = self
                              .project
                              .source_asset_id
                              .and_then(|id| self.project.assets.iter().find(|a| a.id == id))
                              .map(|a| a.duration_frames)
                              .unwrap_or(120);
                          self.project.source_playhead_frame =
                              (self.project.source_playhead_frame + step) % max_src.max(1);
                      }
                      ctx.request_repaint();
                  }

                  // Advance active export progress simulation
                  if let Some(mut prog) = self.export_progress {
                      prog += (dt as f32) * 0.45;
                      if prog >= 1.0 {
                          self.export_progress = None;
                          self.status_toast = format!(
                              "Master Export Completed -> {}",
                              self.export_output_path
                          );
                      } else {
                          self.export_progress = Some(prog);
                          ctx.request_repaint();
                      }
                  }

                  // 2. Rolling Transactional Autosave Check
                  if self.autosave_enabled
                      && self.dirty_since_save
                      && now.duration_since(self.last_autosave)
                          >= Duration::from_secs(self.autosave_interval_secs)
                  {
                      self.perform_autosave(frame.storage_mut());
                  }

                  // 3. Process Keyboard Shortcuts
                  self.handle_keyboard_shortcuts(&ctx);

                  // 4. Render Studio Layout Panels (egui 0.37 Unified Panel API)
                  egui::Panel::top("top_menu_bar")
                      .exact_size(34.0)
                      .show(ui, |ui| {
                          self.render_top_bar(ui);
                      });

                  egui::Panel::bottom("bottom_status_bar")
                      .exact_size(24.0)
                      .show(ui, |ui| {
                          ui.horizontal(|ui| {
                              ui.small(&self.status_toast);
                              ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                                  ui.small(format!(
                                      "Sequence: {} • {:.2} fps • Tool: {}",
                                      self.project.sequence_name,
                                      self.project.fps,
                                      self.active_tool.label()
                                  ));
                              });
                          });
                      });

                  egui::Panel::bottom("nle_timeline_dock")
                      .resizable(true)
                      .default_size(330.0)
                      .min_size(210.0)
                      .show(ui, |ui| {
                          self.render_timeline_panel(ui);
                      });

                  egui::Panel::left("left_project_bins_dock")
                      .resizable(true)
                      .default_size(330.0)
                      .min_size(240.0)
                      .show(ui, |ui| {
                          self.render_left_bins_panel(ui);
                      });

                  egui::Panel::right("right_inspector_dock")
                      .resizable(true)
                      .default_size(370.0)
                      .min_size(270.0)
                      .show(ui, |ui| {
                          self.render_right_inspector_panel(ui);
                      });

                  egui::CentralPanel::default().show(ui, |ui| {
                      self.render_dual_monitors(&ctx, ui);
                  });

                  self.render_modals(&ctx);
              }
          }

          // ============================================================================
          // 17. UNIT TESTS FOR TIMECODE, TRIMMING, UNDO STACK, AND EXPORT PIPELINE
          // ============================================================================

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn test_smpte_timecode_roundtrip() {
                  let tc = frames_to_smpte(24 * 65 + 14, 24.0, false);
                  assert_eq!(tc, "00:01:05:14");
                  let parsed = smpte_to_frames(&tc, 24.0).expect("valid timecode");
                  assert_eq!(parsed, 24 * 65 + 14);
              }

              #[test]
              fn test_lumetri_grade_pipeline() {
                  let mut grade = LumetriGrade::default();
                  grade.exposure = 1.0;
                  grade.contrast = 20.0;
                  grade.lut_preset = LutPreset::TealAndOrange;
                  let out = grade.evaluate_pixel(0.4, 0.4, 0.4, 0.5, 0.5);
                  assert!(out[0] > 0.4);
                  assert!(out[0] <= 1.0 && out[1] <= 1.0 && out[2] <= 1.0);
              }

              #[test]
              fn test_srt_and_edl_exports() {
                  let state = ProjectState::demo_studio_project();
                  let srt = frames_to_srt_time(state.captions[0].start_frame, state.fps);
                  assert_eq!(srt, "00:00:00,250");
              }
          }
          EOF_MAIN
