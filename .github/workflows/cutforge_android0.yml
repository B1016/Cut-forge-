              fn configure_studio_dark_theme(ctx: &egui::Context) {
                  let mut visuals = egui::Visuals::dark();
                  visuals.window_fill = Color32::from_rgb(20, 22, 26);
                  visuals.panel_fill = Color32::from_rgb(22, 24, 29);
                  visuals.extreme_bg_color = Color32::from_rgb(13, 14, 18);
                  visuals.faint_bg_color = Color32::from_rgb(29, 32, 39);
                  visuals.selection.bg_fill = Color32::from_rgb(37, 99, 235);
                  visuals.selection.stroke = Stroke::new(1.0, Color32::from_rgb(96, 165, 250));
                  visuals.widgets.noninteractive.bg_fill = Color32::from_rgb(28, 31, 38);
                  visuals.widgets.inactive.bg_fill = Color32::from_rgb(36, 40, 49);
                  visuals.widgets.hovered.bg_fill = Color32::from_rgb(48, 54, 67);
                  visuals.widgets.active.bg_fill = Color32::from_rgb(59, 130, 246);
                  ctx.set_visuals(visuals);
              }

              /// Commits a mutating edit operation to the Undo/Redo stack and marks the project dirty for Autosave.
              pub fn commit_snapshot(&mut self, action_label: impl Into<String>) {
                  let label = action_label.into();
                  let elapsed = self.session_start.elapsed().as_secs();
                  self.undo_stack
                      .record(label.clone(), self.project.clone(), elapsed);
                  self.dirty_since_save = true;
                  self.status_toast = format!("Action: {label}");
              }

              /// Performs an atomic write-ahead autosave to disk (native) and local storage (WASM).
              pub fn perform_autosave(&mut self, storage: Option<&mut (dyn eframe::Storage + '_')>) {
                  if let Ok(serialized) = serde_json::to_string_pretty(&self.project) {
                      #[cfg(not(target_arch = "wasm32"))]
                      {
                          let tmp_path = format!("{NATIVE_AUTOSAVE_PATH}.tmp");
                          if std::fs::write(&tmp_path, &serialized).is_ok() {
                              let _ = std::fs::rename(&tmp_path, NATIVE_AUTOSAVE_PATH);
                          }
                      }
                      if let Some(st) = storage {
                          st.set_string(AUTOSAVE_STORAGE_KEY, serialized);
                      }
                      self.dirty_since_save = false;
                      self.last_autosave = Instant::now();
                      let secs = self.session_start.elapsed().as_secs();
                      self.last_autosave_status =
                          format!("Autosaved at {:02}:{:02}", (secs / 60) % 60, secs % 60);
                  }
              }

              // ========================================================================
              // 8. NLE EDITING & TRIMMING OPERATIONS (INSERT, OVERWRITE, RAZOR, RIPPLE, ROLL, SLIP, SLIDE)
              // ========================================================================

              pub fn insert_from_source(&mut self) {
                  let Some(asset_id) = self.project.source_asset_id else {
                      self.status_toast = "No clip loaded in Source Monitor.".to_string();
                      return;
                  };
                  let Some(asset) = self.project.assets.iter().find(|a| a.id == asset_id).cloned() else {
                      return;
                  };

                  let in_pt = asset.in_point.clamp(0, asset.duration_frames - 1);
                  let out_pt = asset.out_point.clamp(in_pt + 1, asset.duration_frames);
                  let insert_dur = out_pt - in_pt;
                  let insert_frame = self.project.playhead_frame;

                  let target_track = self
                      .project
                      .tracks
                      .iter()
                      .find(|t| {
                          t.target_enabled
                              && !t.locked
                              && ((asset.kind == AssetKind::Audio && t.kind == TrackKind::Audio)
                                  || (asset.kind != AssetKind::Audio && t.kind == TrackKind::Video))
                      })
                      .map(|t| t.index)
                      .unwrap_or(if asset.kind == AssetKind::Audio { 3 } else { 2 });

                  // Split any clip overlapping `insert_frame` on unlocked sync-locked tracks
                  self.split_clips_at_frame_internal(insert_frame, None);

                  // Shift all clips at or after `insert_frame` forward by `insert_dur`
                  for clip in &mut self.project.clips {
                      let track_unlocked = self
                          .project
                          .tracks
                          .get(clip.track_index)
                          .map(|t| !t.locked && (t.index == target_track || t.sync_lock))
                          .unwrap_or(false);
                      if track_unlocked && clip.timeline_start >= insert_frame {
                          clip.timeline_start += insert_dur;
                      }
                  }

                  let new_id = self.project.alloc_id();
                  let new_clip = TimelineClip {
                      id: new_id,
                      asset_id: asset.id,
                      name: asset.name.clone(),
                      track_index: target_track,
                      timeline_start: insert_frame,
                      duration: insert_dur,
                      source_in: in_pt,
                      speed_pct: 100.0,
                      reverse: false,
                      enabled: true,
                      linked_clip_id: None,
                      color_tag: asset.base_color,
                      transform: Transform2D::default(),
                      grade: LumetriGrade::default(),
                      effects: Vec::new(),
                      audio_gain_db: 0.0,
                      audio_pan: 0.0,
                      fade_in_frames: 0,
                      fade_out_frames: 0,
                      transition_in: None,
                      transition_out: None,
                      title_overlay: if asset.kind == AssetKind::TitleGraphic {
                          Some(TitleOverlay::default())
                      } else {
                          None
                      },
                      keyframes: Vec::new(),
                  };
                  self.project.clips.push(new_clip);
                  self.project.playhead_frame = insert_frame + insert_dur;
                  self.selected_clip_id = Some(new_id);
                  self.commit_snapshot(format!("Insert Edit '{}' ({insert_dur}f)", asset.name));
              }

              pub fn overwrite_from_source(&mut self) {
                  let Some(asset_id) = self.project.source_asset_id else {
                      self.status_toast = "No clip loaded in Source Monitor.".to_string();
                      return;
                  };
                  let Some(asset) = self.project.assets.iter().find(|a| a.id == asset_id).cloned() else {
                      return;
                  };

                  let in_pt = asset.in_point.clamp(0, asset.duration_frames - 1);
                  let out_pt = asset.out_point.clamp(in_pt + 1, asset.duration_frames);
                  let ow_dur = out_pt - in_pt;
                  let start = self.project.playhead_frame;
                  let end = start + ow_dur;

                  let target_track = self
                      .project
                      .tracks
                      .iter()
                      .find(|t| {
                          t.target_enabled
                              && !t.locked
                              && ((asset.kind == AssetKind::Audio && t.kind == TrackKind::Audio)
                                  || (asset.kind != AssetKind::Audio && t.kind == TrackKind::Video))
                      })
                      .map(|t| t.index)
                      .unwrap_or(if asset.kind == AssetKind::Audio { 3 } else { 2 });

                  self.clear_range_on_track(target_track, start, end);

                  let new_id = self.project.alloc_id();
                  self.project.clips.push(TimelineClip {
                      id: new_id,
                      asset_id: asset.id,
                      name: asset.name.clone(),
                      track_index: target_track,
                      timeline_start: start,
                      duration: ow_dur,
                      source_in: in_pt,
                      speed_pct: 100.0,
                      reverse: false,
                      enabled: true,
                      linked_clip_id: None,
                      color_tag: asset.base_color,
                      transform: Transform2D::default(),
                      grade: LumetriGrade::default(),
                      effects: Vec::new(),
                      audio_gain_db: 0.0,
                      audio_pan: 0.0,
                      fade_in_frames: 0,
                      fade_out_frames: 0,
                      transition_in: None,
                      transition_out: None,
                      title_overlay: if asset.kind == AssetKind::TitleGraphic {
                          Some(TitleOverlay::default())
                      } else {
                          None
                      },
                      keyframes: Vec::new(),
                  });
                  self.project.playhead_frame = end;
                  self.selected_clip_id = Some(new_id);
                  self.commit_snapshot(format!("Overwrite Edit '{}' ({ow_dur}f)", asset.name));
              }

              fn clear_range_on_track(&mut self, track_index: usize, start: i64, end: i64) {
                  let mut additions = Vec::new();
                  let mut next_id = self.project.next_id;

                  self.project.clips.retain_mut(|clip| {
                      if clip.track_index != track_index {
                          return true;
                      }
                      let c_start = clip.timeline_start;
                      let c_end = clip.timeline_end();
                      if c_end <= start || c_start >= end {
                          return true;
                      }
                      if c_start >= start && c_end <= end {
                          // Completely covered
                          return false;
                      }
                      if c_start < start && c_end > end {
                          // Split into left and right remnants
                          let right_dur = c_end - end;
                          let left_dur = start - c_start;
                          let mut right_clip = clip.clone();
                          right_clip.id = next_id;
                          next_id += 1;
                          right_clip.timeline_start = end;
                          right_clip.duration = right_dur;
                          right_clip.source_in += end - c_start;
                          additions.push(right_clip);

                          clip.duration = left_dur;
                          return true;
                      }
                      if c_start < start {
                          clip.duration = start - c_start;
                          return true;
                      }
                      // Overlaps left side
                      let trim = end - c_start;
                      clip.timeline_start = end;
                      clip.duration -= trim;
                      clip.source_in += trim;
                      clip.duration > 0
                  });

                  self.project.next_id = next_id;
                  self.project.clips.extend(additions);
              }

              pub fn razor_split_at(&mut self, frame: i64, specific_clip_id: Option<u64>) {
                  if self.split_clips_at_frame_internal(frame, specific_clip_id) {
                      self.commit_snapshot(format!(
                          "Razor Split at {}",
                          frames_to_smpte(frame, self.project.fps, self.project.drop_frame)
                      ));
                  }
              }

              fn split_clips_at_frame_internal(&mut self, frame: i64, specific_clip_id: Option<u64>) -> bool {
                  let mut new_clips = Vec::new();
                  let mut next_id = self.project.next_id;
                  let locked_tracks: Vec<bool> = self.project.tracks.iter().map(|t| t.locked).collect();

                  for clip in &mut self.project.clips {
                      if locked_tracks.get(clip.track_index).copied().unwrap_or(false) {
                          continue;
                      }
                      if let Some(target_id) = specific_clip_id {
                          if clip.id != target_id {
                              continue;
                          }
                      }
                      if frame > clip.timeline_start && frame < clip.timeline_end() {
                          let left_dur = frame - clip.timeline_start;
                          let right_dur = clip.timeline_end() - frame;
                          let mut right_half = clip.clone();
                          right_half.id = next_id;
                          next_id += 1;
                          right_half.timeline_start = frame;
                          right_half.duration = right_dur;
                          right_half.source_in =
                              clip.source_in + ((left_dur as f32) * (clip.speed_pct / 100.0)).round() as i64;
                          right_half.transition_in = None;

                          clip.duration = left_dur;
                          clip.transition_out = None;
                          new_clips.push(right_half);
                      }
                  }

                  self.project.next_id = next_id;
                  let changed = !new_clips.is_empty();
                  self.project.clips.extend(new_clips);
                  changed
              }

              pub fn ripple_delete_selected(&mut self) {
                  let Some(sel_id) = self.selected_clip_id else {
                      return;
                  };
                  let Some(target) = self.project.clips.iter().find(|c| c.id == sel_id).cloned() else {
                      return;
                  };
                  if self
                      .project
                      .tracks
                      .get(target.track_index)
                      .map(|t| t.locked)
                      .unwrap_or(false)
                  {
                      self.status_toast = "Track is locked.".to_string();
                      return;
                  }

                  self.project.clips.retain(|c| c.id != sel_id);
                  for clip in &mut self.project.clips {
                      if clip.track_index == target.track_index && clip.timeline_start >= target.timeline_end()
                      {
                          clip.timeline_start = (clip.timeline_start - target.duration).max(0);
                      }
                  }
                  self.selected_clip_id = None;
                  self.commit_snapshot(format!(
                      "Ripple Delete '{}' (-{}f)",
                      target.name, target.duration
                  ));
              }

              pub fn lift_work_area(&mut self) {
                  let (Some(in_f), Some(out_f)) = (self.project.sequence_in, self.project.sequence_out) else {
                      self.status_toast = "Set Sequence In (I) and Out (O) points first.".to_string();
                      return;
                  };
                  if out_f <= in_f {
                      return;
                  }
                  let unlocked_indices: Vec<usize> = self
                      .project
                      .tracks
                      .iter()
                      .filter(|t| !t.locked)
                      .map(|t| t.index)
                      .collect();
                  for idx in unlocked_indices {
                      self.clear_range_on_track(idx, in_f, out_f);
                  }
                  self.commit_snapshot(format!("Lift Work Area ({}f)", out_f - in_f));
              }

              pub fn extract_work_area(&mut self) {
                  let (Some(in_f), Some(out_f)) = (self.project.sequence_in, self.project.sequence_out) else {
                      self.status_toast = "Set Sequence In (I) and Out (O) points first.".to_string();
                      return;
                  };
                  if out_f <= in_f {
                      return;
                  }
                  let delta = out_f - in_f;
                  let unlocked_indices: Vec<usize> = self
                      .project
                      .tracks
                      .iter()
                      .filter(|t| !t.locked)
                      .map(|t| t.index)
                      .collect();
                  for idx in &unlocked_indices {
                      self.clear_range_on_track(*idx, in_f, out_f);
                  }
                  for clip in &mut self.project.clips {
                      if unlocked_indices.contains(&clip.track_index) && clip.timeline_start >= out_f {
                          clip.timeline_start = (clip.timeline_start - delta).max(0);
                      }
                  }
                  self.project.playhead_frame = in_f;
                  self.commit_snapshot(format!("Extract Work Area (-{delta}f)"));
              }

              pub fn add_marker_at_playhead(&mut self) {
                  let frame = self.project.playhead_frame;
                  if let Some(existing) = self.project.markers.iter().find(|m| m.frame == frame) {
                      self.selected_marker_id = Some(existing.id);
                      self.show_marker_editor_modal = true;
                      return;
                  }
                  let id = self.project.alloc_id();
                  let marker_num = self.project.markers.len() + 1;
                  self.project.markers.push(TimelineMarker {
                      id,
                      frame,
                      duration_frames: 0,
                      name: format!("Marker {marker_num:02}"),
                      comment: "Production note at playhead".to_string(),
                      category: MarkerCategory::EditNote,
                  });
                  self.selected_marker_id = Some(id);
                  self.commit_snapshot(format!(
                      "Add Marker at {}",
                      frames_to_smpte(frame, self.project.fps, self.project.drop_frame)
                  ));
              }

              /// Snaps a candidate frame to nearby clip boundaries, markers, or the playhead within threshold.
              pub fn snap_frame(&self, candidate: i64, ignore_clip_id: Option<u64>) -> i64 {
                  if !self.snap_enabled {
                      return candidate.max(0);
                  }
                  let threshold_frames = (10.0 / self.timeline_zoom_px_per_frame.max(0.2)).round() as i64;
                  let threshold_frames = threshold_frames.clamp(1, 12);

                  let mut best = candidate;
                  let mut best_dist = threshold_frames + 1;

                  let mut snap_points = vec![0, self.project.playhead_frame];
                  if let Some(i) = self.project.sequence_in {
                      snap_points.push(i);
                  }
                  if let Some(o) = self.project.sequence_out {
                      snap_points.push(o);
                  }
                  for m in &self.project.markers {
                      snap_points.push(m.frame);
                  }
                  for c in &self.project.clips {
                      if Some(c.id) != ignore_clip_id {
                          snap_points.push(c.timeline_start);
                          snap_points.push(c.timeline_end());
                      }
                  }

                  for pt in snap_points {
                      let d = (candidate - pt).abs();
                      if d < best_dist {
                          best_dist = d;
                          best = pt;
                      }
                  }
                  best.max(0)
              }

              // ========================================================================
              // 9. REAL-TIME COMPOSITOR & FRAME SYNTHESIZER (SOURCE + PROGRAM + SCOPES)
              // ========================================================================

              /// Renders a 320x180 RGB frame buffer for the Source Monitor.
              pub fn synthesize_source_frame(&self, width: usize, height: usize) -> ColorImage {
                  let mut pixels = vec![Color32::from_rgb(16, 18, 22); width * height];
                  let Some(asset_id) = self.project.source_asset_id else {
                      return ColorImage::new([width, height], pixels);
                  };
                  let Some(asset) = self.project.assets.iter().find(|a| a.id == asset_id) else {
                      return ColorImage::new([width, height], pixels);
                  };

                  let frame = self.project.source_playhead_frame;
                  for y in 0..height {
                      let v = (y as f32) / (height as f32);
                      for x in 0..width {
                          let u = (x as f32) / (width as f32);
                          let [r, g, b] = Self::sample_procedural_asset(asset, frame, u, v);
                          pixels[y * width + x] = Color32::from_rgb(
                              (r * 255.0) as u8,
                              (g * 255.0) as u8,
                              (b * 255.0) as u8,
                          );
                      }
                  }
                  ColorImage::new([width, height], pixels)
              }

              /// Evaluates the multi-track Video compositor at `self.project.playhead_frame`, applying
              /// 2D Transform, Lumetri Color Grading, Clip Effects, and Transitions.
              pub fn synthesize_program_frame(&self, width: usize, height: usize) -> (ColorImage, Vec<[f32; 3]>) {
                  let playhead = self.project.playhead_frame;
                  let solo_any_video = self
                      .project
                      .tracks
                      .iter()
                      .any(|t| t.kind == TrackKind::Video && t.solo);

                  // Gather active video clips from bottom track (V1 = highest index) to top track (V3 = index 0)
                  let mut active_layers: Vec<(&TimelineClip, &MediaAsset)> = Vec::new();
                  let mut video_tracks: Vec<&Track> = self
                      .project
                      .tracks
                      .iter()
                      .filter(|t| t.kind == TrackKind::Video)
                      .collect();
                  video_tracks.sort_by(|a, b| b.index.cmp(&a.index)); // Bottom-up compositing order (V1 -> V2 -> V3)

                  for track in video_tracks {
                      if !track.visible_or_unmuted {
                          continue;
                      }
                      if solo_any_video && !track.solo {
                          continue;
                      }
                      for clip in &self.project.clips {
                          if clip.track_index == track.index
                              && clip.enabled
                              && playhead >= clip.timeline_start
                              && playhead < clip.timeline_end()
                          {
                              if let Some(asset) = self.project.assets.iter().find(|a| a.id == clip.asset_id) {
                                  active_layers.push((clip, asset));
                              }
                          }
                      }
                  }

                  let mut float_buffer = vec![[0.05_f32, 0.055_f32, 0.07_f32]; width * height];
                  let mut pixels = vec![Color32::from_rgb(13, 14, 18); width * height];

                  if active_layers.is_empty() {
                      return (
                          ColorImage::new([width, height], pixels),
                          float_buffer,
                      );
                  }

                  for (clip, asset) in active_layers {
                      let local_frame = playhead - clip.timeline_start;
                      let src_frame = if clip.reverse {
                          clip.source_out() - local_frame
                      } else {
                          clip.source_in + ((local_frame as f32) * (clip.speed_pct / 100.0)).round() as i64
                      };

                      // Evaluate transition alpha / dip factor
                      let mut layer_alpha = (clip.transform.opacity_pct / 100.0).clamp(0.0, 1.0);
                      let mut dip_white = 0.0_f32;
                      let mut wipe_cutoff_u = 0.0_f32;

                      if let Some(tr_in) = &clip.transition_in {
                          if local_frame < tr_in.duration_frames.max(1) {
                              let p = (local_frame as f32) / (tr_in.duration_frames.max(1) as f32);
                              match tr_in.kind {
                                  TransitionKind::CrossDissolve | TransitionKind::DipToBlack => {
                                      layer_alpha *= p.clamp(0.0, 1.0);
                                  }
                                  TransitionKind::DipToWhite => {
                                      dip_white = (1.0 - p).clamp(0.0, 1.0);
                                  }
                                  TransitionKind::WipeLeftToRight => {
                                      wipe_cutoff_u = 1.0 - p.clamp(0.0, 1.0);
                                  }
                              }
                          }
                      }
                      let frames_from_end = clip.duration - local_frame;
                      if let Some(tr_out) = &clip.transition_out {
                          if frames_from_end <= tr_out.duration_frames.max(1) {
                              let p = (frames_from_end as f32) / (tr_out.duration_frames.max(1) as f32);
                              match tr_out.kind {
                                  TransitionKind::CrossDissolve | TransitionKind::DipToBlack => {
                                      layer_alpha *= p.clamp(0.0, 1.0);
                                  }
                                  TransitionKind::DipToWhite => {
                                      dip_white = dip_white.max((1.0 - p).clamp(0.0, 1.0));
                                  }
                                  TransitionKind::WipeLeftToRight => {
                                      wipe_cutoff_u = wipe_cutoff_u.max(1.0 - p.clamp(0.0, 1.0));
                                  }
                              }
                          }
                      }

                      // Title graphics composite via vector Painter overlay, so skip full-frame opaque fill
                      if asset.kind == AssetKind::TitleGraphic {
                          continue;
                      }

                      let scale = (clip.transform.scale_pct / 100.0).max(0.1);
                      let offset_u = clip.transform.pos_x / 1920.0;
                      let offset_v = clip.transform.pos_y / 1080.0;

                      let mirror = clip
                          .effects
                          .iter()
                          .any(|e| e.enabled && e.kind == EffectKind::MirrorHorizontal);
                      let posterize_amt = clip
                          .effects
                          .iter()
                          .find(|e| e.enabled && e.kind == EffectKind::Posterize)
                          .map(|e| e.amount)
                          .unwrap_or(0.0);
                      let grain_amt = clip
                          .effects
                          .iter()
                          .find(|e| e.enabled && e.kind == EffectKind::FilmGrain)
                          .map(|e| e.amount)
                          .unwrap_or(0.0);
                      let chroma_amt = clip
                          .effects
                          .iter()
                          .find(|e| e.enabled && e.kind == EffectKind::ChromaticAberration)
                          .map(|e| e.amount)
                          .unwrap_or(0.0);

                      for y in 0..height {
                          let raw_v = (y as f32) / (height as f32);
                          let v = (raw_v - 0.5 - offset_v) / scale + 0.5;
                          if v < (clip.transform.crop_top_pct / 100.0)
                              || v > 1.0 - (clip.transform.crop_bottom_pct / 100.0)
                          {
                              continue;
                          }

                          for x in 0..width {
                              let raw_u = (x as f32) / (width as f32);
                              if raw_u < wipe_cutoff_u {
                                  continue;
                              }
                              let mut u = (raw_u - 0.5 - offset_u) / scale + 0.5;
                              if mirror {
                                  u = 1.0 - u;
                              }
                              if u < (clip.transform.crop_left_pct / 100.0)
                                  || u > 1.0 - (clip.transform.crop_right_pct / 100.0)
                              {
                                  continue;
                              }

                              let [mut r, mut g, mut b] = if chroma_amt > 0.5 {
                                  let shift = chroma_amt * 0.0004;
                                  let r_s = Self::sample_procedural_asset(asset, src_frame, u + shift, v)[0];
                                  let g_s = Self::sample_procedural_asset(asset, src_frame, u, v)[1];
                                  let b_s = Self::sample_procedural_asset(asset, src_frame, u - shift, v)[2];
                                  [r_s, g_s, b_s]
                              } else {
                                  Self::sample_procedural_asset(asset, src_frame, u, v)
                              };

                              // Evaluate Lumetri Color Pipeline
                              [r, g, b] = clip.grade.evaluate_pixel(r, g, b, raw_u, raw_v);

                              // Posterize effect
                              if posterize_amt > 1.0 {
                                  let levels = (24.0 - (posterize_amt * 0.18)).max(2.0);
                                  r = (r * levels).round() / levels;
                                  g = (g * levels).round() / levels;
                                  b = (b * levels).round() / levels;
                              }

                              // 35mm Film Grain effect
                              if grain_amt > 0.5 {
                                  let hash = (((x as u32).wrapping_mul(1973)
                                      ^ (y as u32).wrapping_mul(9277)
                                      ^ (playhead as u32).wrapping_mul(26699))
                                      % 1000) as f32
                                      / 500.0
                                      - 1.0;
                                  let g_delta = hash * (grain_amt / 100.0) * 0.12;
                                  r = (r + g_delta).clamp(0.0, 1.0);
                                  g = (g + g_delta).clamp(0.0, 1.0);
                                  b = (b + g_delta).clamp(0.0, 1.0);
                              }

                              if dip_white > 0.001 {
                                  r = r * (1.0 - dip_white) + dip_white;
                                  g = g * (1.0 - dip_white) + dip_white;
                                  b = b * (1.0 - dip_white) + dip_white;
                              }

                              let dst = &mut float_buffer[y * width + x];
                              dst[0] = dst[0] * (1.0 - layer_alpha) + r * layer_alpha;
                              dst[1] = dst[1] * (1.0 - layer_alpha) + g * layer_alpha;
                              dst[2] = dst[2] * (1.0 - layer_alpha) + b * layer_alpha;
                          }
                      }
                  }

                  for (i, rgb) in float_buffer.iter().enumerate() {
                      pixels[i] = Color32::from_rgb(
                          (rgb[0].clamp(0.0, 1.0) * 255.0) as u8,
                          (rgb[1].clamp(0.0, 1.0) * 255.0) as u8,
                          (rgb[2].clamp(0.0, 1.0) * 255.0) as u8,
                      );
                  }

                  (
                      ColorImage::new([width, height], pixels),
                      float_buffer,
                  )
              }

              /// Generates rich, cinema-like procedural scenes for each camera asset so the Color Wheels,
              /// Scopes, and Transitions react with genuine highlights, skin-tone midtones, and shadows.
              fn sample_procedural_asset(asset: &MediaAsset, frame: i64, u: f32, v: f32) -> [f32; 3] {
                  let t = (frame as f32) * 0.045;
                  let c1 = [
                      asset.base_color[0] as f32 / 255.0,
                      asset.base_color[1] as f32 / 255.0,
                      asset.base_color[2] as f32 / 255.0,
                  ];
                  let c2 = [
                      asset.secondary_color[0] as f32 / 255.0,
                      asset.secondary_color[1] as f32 / 255.0,
                      asset.secondary_color[2] as f32 / 255.0,
                  ];

                  match asset.scene_pattern {
                      0 => {
                          // Studio Key Interview Scene: Soft bokeh background + warm key-lit subject silhouette
                          let bg_grad = (1.0 - v * 0.75).clamp(0.0, 1.0);
                          let bokeh1 = ((u - (0.25 + 0.04 * t.sin())).powi(2) + (v - 0.30).powi(2)).sqrt();
                          let bokeh2 = ((u - (0.78 - 0.03 * t.cos())).powi(2) + (v - 0.26).powi(2)).sqrt();
                          let glow = (-bokeh1 * 14.0).exp() * 0.45 + (-bokeh2 * 16.0).exp() * 0.40;

                          let mut r = c1[0] * bg_grad + c2[0] * glow;
                          let mut g = c1[1] * bg_grad + c2[1] * glow;
                          let mut b = c1[2] * bg_grad + c2[2] * glow * 0.6;

                          // Subject head & shoulders warm skin-tone reflectance
                          let head_dist =
                              (((u - 0.50) * 1.35).powi(2) + ((v - 0.42 - 0.01 * t.sin()) * 1.1).powi(2))
                                  .sqrt();
                          let shoulder_dist =
                              (((u - 0.50) * 0.75).powi(2) + ((v - 0.88) * 1.25).powi(2)).sqrt();
                          if head_dist < 0.16 || shoulder_dist < 0.26 {
                              let key_light = (1.0 - (u - 0.44) * 1.8).clamp(0.35, 1.15);
                              r = (0.76 * key_light).clamp(0.0, 1.0);
                              g = (0.56 * key_light).clamp(0.0, 1.0);
                              b = (0.44 * key_light).clamp(0.0, 1.0);
                          }
                          [r.clamp(0.0, 1.0), g.clamp(0.0, 1.0), b.clamp(0.0, 1.0)]
                      }
                      1 => {
                          // Addis Skyline Dusk Aerial: Sunset horizon + illuminated city towers
                          let horizon = 0.62;
                          if v < horizon {
                              let sky_t = (v / horizon).clamp(0.0, 1.0);
                              let sun_d = ((u - (0.62 + 0.03 * t.sin())).powi(2)
                                  + (v - 0.48).powi(2))
                              .sqrt();
                              let sun = (-sun_d * 10.0).exp() * 0.55;
                              [
                                  (c1[0] * (1.0 - sky_t) + c2[0] * sky_t + sun).clamp(0.0, 1.0),
                                  (c1[1] * (1.0 - sky_t) + c2[1] * sky_t + sun * 0.7).clamp(0.0, 1.0),
                                  (c1[2] * (1.0 - sky_t * 0.5) + c2[2] * 0.35).clamp(0.0, 1.0),
                              ]
                          } else {
                              let pan_u = u + t * 0.02;
                              let col_idx = (pan_u * 28.0).floor() as i32;
                              let tower_h = ((col_idx * 37) % 19) as f32 * 0.012;
                              let is_window = ((pan_u * 140.0).sin() > 0.35) && ((v * 90.0).cos() > 0.25);
                              if v > horizon - tower_h && is_window {
                                  [0.95, 0.78, 0.42]
                              } else {
                                  [0.09, 0.11, 0.16]
                              }
                          }
                      }
                      _ => {
                          // Server Rack Macro / Telemetry Matrix
                          let grid_x = ((u * 24.0 + t * 0.8).sin()).abs();
                          let grid_y = ((v * 16.0).cos()).abs();
                          let led = if grid_x > 0.88 && grid_y > 0.75 {
                              0.65
                          } else {
                              0.0
                          };
                          [
                              (c1[0] * (1.0 - v * 0.5) + c2[0] * led).clamp(0.0, 1.0),
                              (c1[1] * (1.0 - v * 0.4) + c2[1] * led).clamp(0.0, 1.0),
                              (c1[2] * (1.0 - u * 0.3) + c2[2] * led).clamp(0.0, 1.0),
                          ]
                      }
                  }
              }

              // ========================================================================
              // 10. FFMPEG COMPLEX FILTERGRAPH & EDL / SRT / VTT EXPORT GENERATORS
              // ========================================================================

              /// Generates a complete, production-ready FFmpeg command line with `-filter_complex`
              /// representing all timeline clips, trims, Lumetri color adjustments, audio gain/EQ, and captions.
              pub fn build_ffmpeg_export_command(&self) -> String {
                  let mut cmd = String::from("ffmpeg -y \\\n");
                  for asset in &self.project.assets {
                      if asset.kind == AssetKind::Video || asset.kind == AssetKind::Audio {
                          cmd.push_str(&format!("  -i \"{}\" \\\n", asset.file_path));
                      }
                  }

                  let mut filter_parts = Vec::new();
                  let mut v_concat_inputs = Vec::new();

                  let mut v1_clips: Vec<&TimelineClip> = self
                      .project
                      .clips
                      .iter()
                      .filter(|c| c.track_index == 2 && c.enabled)
                      .collect();
                  v1_clips.sort_by_key(|c| c.timeline_start);

                  for (idx, clip) in v1_clips.iter().enumerate() {
                      let start_s = (clip.source_in as f64) / self.project.fps;
                      let dur_s = (clip.duration as f64) / self.project.fps;
                      let contrast = (1.0 + clip.grade.contrast / 100.0).clamp(0.2, 2.0);
                      let brightness = (clip.grade.exposure * 0.12).clamp(-0.5, 0.5);
                      let saturation = (clip.grade.saturation / 100.0).clamp(0.0, 3.0);
                      let label = format!("vclip{idx}");
                      filter_parts.push(format!(
                          "[0:v]trim=start={start_s:.3}:duration={dur_s:.3},setpts=PTS-STARTPTS,eq=contrast={contrast:.2}:brightness={brightness:.2}:saturation={saturation:.2}[{label}]"
                      ));
                      v_concat_inputs.push(format!("[{label}]"));
                  }

                  if !v_concat_inputs.is_empty() {
                      let joined = v_concat_inputs.join("");
                      let count = v_concat_inputs.len();
                      filter_parts.push(format!(
                          "{joined}concat=n={count}:v=1:a=0[vout_raw]"
                      ));
                      if self.export_burn_in_captions && !self.project.captions.is_empty() {
                          filter_parts.push(
                              "[vout_raw]subtitles=captions_export.srt:force_style='FontSize=20,PrimaryColour=&H00FFFFFF&'[vout]"
                                  .to_string(),
                          );
                      } else {
                          filter_parts.push("[vout_raw]null[vout]".to_string());
                      }
                  }

                  filter_parts.push(format!(
                      "[0:a]loudnorm=I={:.1}:TP=-1.5:LRA=11[aout]",
                      self.project.master_lufs_target
                  ));

                  cmd.push_str(&format!(
                      "  -filter_complex \"{}\" \\\n",
                      filter_parts.join("; ")
                  ));

                  let vcodec = match (self.export_preset, self.export_hw_encoder) {
                      (ExportFormatPreset::AppleProRes422Hq, _) => "-c:v prores_ks -profile:v 3",
                      (ExportFormatPreset::WebmVp9Browser, _) => "-c:v libvpx-vp9 -b:v 18M",
                      (ExportFormatPreset::AudioOnlyWavMaster, _) => "-vn",
                      (ExportFormatPreset::HevcMp4Hdr10, HardwareEncoder::AppleVideoToolbox) => {
                          "-c:v hevc_videotoolbox -b:v 35M"
                      }
                      (ExportFormatPreset::HevcMp4Hdr10, HardwareEncoder::NvidiaNvenc) => {
                          "-c:v hevc_nvenc -preset p6 -b:v 35M"
                      }
                      (ExportFormatPreset::HevcMp4Hdr10, _) => "-c:v libx265 -crf 18",
                      (_, HardwareEncoder::AppleVideoToolbox) => "-c:v h264_videotoolbox -b:v 45M",
                      (_, HardwareEncoder::NvidiaNvenc) => "-c:v h264_nvenc -preset p6 -b:v 45M",
                      (_, HardwareEncoder::LinuxVaapi) => "-c:v h264_vaapi -b:v 45M",
                      _ => "-c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p",
                  };

                  cmd.push_str(&format!(
                      "  -map \"[vout]\" -map \"[aout]\" {vcodec} -c:a aac -b:a 320k -ar 48000 \"{}\"",
                      self.export_output_path
                  ));
                  cmd
              }

              /// Exports all active captions in standard SubRip (`.srt`) format.
              pub fn export_captions_srt(&self) -> String {
                  let mut out = String::new();
                  for (i, cap) in self
                      .project
                      .captions
                      .iter()
                      .filter(|c| c.enabled)
                      .enumerate()
                  {
                      let idx = i + 1;
                      let start = frames_to_srt_time(cap.start_frame, self.project.fps);
                      let end = frames_to_srt_time(cap.end_frame, self.project.fps);
                      out.push_str(&format!(
                          "{idx}\n{start} --> {end}\n[{}] {}\n\n",
                          cap.speaker, cap.text
                      ));
                  }
                  out
              }

              /// Exports all active captions in W3C WebVTT (`.vtt`) format.
              pub fn export_captions_vtt(&self) -> String {
                  let mut out = String::from("WEBVTT - CutForge Pro Caption Track\n\n");
                  for (i, cap) in self
                      .project
                      .captions
                      .iter()
                      .filter(|c| c.enabled)
                      .enumerate()
                  {
                      let idx = i + 1;
                      let start = frames_to_vtt_time(cap.start_frame, self.project.fps);
                      let end = frames_to_vtt_time(cap.end_frame, self.project.fps);
                      out.push_str(&format!(
                          "{idx}\n{start} --> {end} line:88%\n<v {}>{}\n\n",
                          cap.speaker, cap.text
                      ));
                  }
                  out
              }

              /// Exports a standard CMX 3600 Edit Decision List (`.edl`) for post-house interchange.
              pub fn export_cmx3600_edl(&self) -> String {
                  let mut edl = format!(
                      "TITLE: {}\nFCM: {}\n\n",
                      self.project.sequence_name,
                      if self.project.drop_frame {
                          "DROP FRAME"
                      } else {
                          "NON-DROP FRAME"
                      }
                  );
                  let mut sorted = self.project.clips.clone();
                  sorted.sort_by_key(|c| (c.track_index, c.timeline_start));
                  for (idx, clip) in sorted.iter().enumerate() {
                      let event_num = idx + 1;
                      let src_in = frames_to_smpte(clip.source_in, self.project.fps, self.project.drop_frame);
                      let src_out =
                          frames_to_smpte(clip.source_out(), self.project.fps, self.project.drop_frame);
                      let rec_in =
                          frames_to_smpte(clip.timeline_start, self.project.fps, self.project.drop_frame);
                      let rec_out =
                          frames_to_smpte(clip.timeline_end(), self.project.fps, self.project.drop_frame);
                      let ch = if clip.track_index <= 2 { "V" } else { "A" };
                      edl.push_str(&format!(
                          "{event_num:03}  AX       {ch:<5} C        {src_in} {src_out} {rec_in} {rec_out}\n* FROM CLIP NAME: {}\n\n",
                          clip.name
                      ));
                  }
                  edl
              }

              // ========================================================================
              // 11. KEYBOARD INPUT DISPATCHER & SHORTCUT REBINDING
              // ========================================================================

              fn handle_keyboard_shortcuts(&mut self, ctx: &egui::Context) {
                  if ctx.egui_wants_keyboard_input() && self.rebinding_action.is_none() {
                      return;
                  }

                  // Live key capture if user is rebinding a shortcut inside the Shortcuts Modal
                  if let Some(target_action) = self.rebinding_action {
                      let mut captured: Option<KeyBind> = None;
                      ctx.input(|i| {
                          for ev in &i.events {
                              if let egui::Event::Key {
                                  key,
                                  pressed: true,
                                  modifiers,
                                  ..
                              } = ev
                              {
                                  if *key == Key::Escape {
                                      return;
                                  }
                                  let key_str = format!("{key:?}");
                                  captured = Some(KeyBind {
                                      key_name: key_str,
                                      ctrl_or_cmd: modifiers.command || modifiers.ctrl,
                                      shift: modifiers.shift,
                                      alt: modifiers.alt,
                                  });
                              }
                          }
                      });
                      if let Some(new_bind) = captured {
                          self.shortcuts
                              .bindings
                              .insert(target_action, new_bind.clone());
                          self.rebinding_action = None;
                          self.status_toast = format!(
                              "Bound '{}' to {}",
                              target_action.label(),
                              new_bind.display()
                          );
                      }
                      return;
                  }

                  let mut triggered_action: Option<ShortcutAction> = None;
                  ctx.input_mut(|i| {
                      // Sort shortcuts so modifier-heavy shortcuts are checked before plain single keys
                      let mut entries: Vec<(&ShortcutAction, &KeyBind)> =
                          self.shortcuts.bindings.iter().collect();
                      entries.sort_by_key(|(_, kb)| {
                          let mod_count =
                              (kb.ctrl_or_cmd as u8) + (kb.shift as u8) + (kb.alt as u8);
                          std::cmp::Reverse(mod_count)
                      });

                      for (act, bind) in entries {
                          if let Some(sc) = bind.to_egui_shortcut() {
                              if i.consume_shortcut(&sc) {
                                  triggered_action = Some(*act);
                                  break;
                              }
                          }
                      }
                  });

                  if let Some(action) = triggered_action {
                      self.execute_shortcut_action(action);
                  }
              }

              pub fn execute_shortcut_action(&mut self, action: ShortcutAction) {
                  let max_frame = self.project.sequence_duration_frames();
                  match action {
                      ShortcutAction::PlayPause => {
                          self.is_playing = !self.is_playing;
                          self.shuttle_speed = if self.is_playing { 1.0 } else { 0.0 };
                      }
                      ShortcutAction::ShuttleReverse => {
                          if !self.is_playing || self.shuttle_speed >= 0.0 {
                              self.is_playing = true;
                              self.shuttle_speed = -1.0;
                          } else {
                              self.shuttle_speed = (self.shuttle_speed * 2.0).max(-4.0);
                          }
                      }
                      ShortcutAction::ShuttleStop => {
                          self.is_playing = false;
                          self.shuttle_speed = 0.0;
                      }
                      ShortcutAction::ShuttleForward => {
                          if !self.is_playing || self.shuttle_speed <= 0.0 {
                              self.is_playing = true;
                              self.shuttle_speed = 1.0;
                          } else {
                              self.shuttle_speed = (self.shuttle_speed * 2.0).min(4.0);
                          }
                      }
                      ShortcutAction::StepBackFrame => {
                          self.is_playing = false;
                          self.project.playhead_frame = (self.project.playhead_frame - 1).max(0);
                      }
                      ShortcutAction::StepForwardFrame => {
                          self.is_playing = false;
                          self.project.playhead_frame =
                              (self.project.playhead_frame + 1).min(max_frame);
                      }
                      ShortcutAction::MarkIn => {
                          self.project.sequence_in = Some(self.project.playhead_frame);
                          self.status_toast = format!(
                              "Sequence In set to {}",
                              frames_to_smpte(
                                  self.project.playhead_frame,
                                  self.project.fps,
                                  self.project.drop_frame
                              )
                          );
                      }
                      ShortcutAction::MarkOut => {
                          self.project.sequence_out = Some(self.project.playhead_frame);
                          self.status_toast = format!(
                              "Sequence Out set to {}",
                              frames_to_smpte(
                                  self.project.playhead_frame,
                                  self.project.fps,
                                  self.project.drop_frame
                              )
                          );
                      }
                      ShortcutAction::ClearInOut => {
                          self.project.sequence_in = None;
                          self.project.sequence_out = None;
                          self.status_toast = "Cleared Sequence In/Out points".to_string();
                      }
                      ShortcutAction::InsertFromSource => self.insert_from_source(),
                      ShortcutAction::OverwriteFromSource => self.overwrite_from_source(),
                      ShortcutAction::LiftWorkArea => self.lift_work_area(),
                      ShortcutAction::ExtractWorkArea => self.extract_work_area(),
                      ShortcutAction::RazorAtPlayhead => {
                          self.razor_split_at(self.project.playhead_frame, None)
                      }
                      ShortcutAction::RippleDeleteSelected => self.ripple_delete_selected(),
                      ShortcutAction::AddMarkerAtPlayhead => self.add_marker_at_playhead(),
                      ShortcutAction::ToolSelection => self.active_tool = EditTool::Selection,
                      ShortcutAction::ToolTrackForward => self.active_tool = EditTool::TrackSelectForward,
                      ShortcutAction::ToolRippleEdit => self.active_tool = EditTool::RippleEdit,
                      ShortcutAction::ToolRollEdit => self.active_tool = EditTool::RollEdit,
                      ShortcutAction::ToolRazor => self.active_tool = EditTool::Razor,
                      ShortcutAction::ToolSlip => self.active_tool = EditTool::Slip,
                      ShortcutAction::ToolSlide => self.active_tool = EditTool::Slide,
                      ShortcutAction::ToggleSnap => {
                          self.snap_enabled = !self.snap_enabled;
                          self.status_toast = format!(
                              "Timeline Magnetic Snap: {}",
                              if self.snap_enabled { "ON" } else { "OFF" }
                          );
                      }
                      ShortcutAction::Undo => {
                          if let Some((label, restored)) = self.undo_stack.undo() {
                              self.project = restored;
                              self.status_toast = format!("Undo -> {label}");
                          }
                      }
                      ShortcutAction::Redo => {
                          if let Some((label, restored)) = self.undo_stack.redo() {
                              self.project = restored;
                              self.status_toast = format!("Redo -> {label}");
                          }
                      }
                      ShortcutAction::SaveProject => {
                          self.perform_autosave(None);
                          self.status_toast = "Project saved to transactional journal.".to_string();
                      }
                      ShortcutAction::OpenExportDialog => self.show_export_modal = true,
                      ShortcutAction::OpenShortcutsDialog => self.show_shortcuts_modal = true,
                  }
              }

