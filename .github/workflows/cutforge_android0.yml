          // 4. TRANSACTIONAL UNDO / REDO COMMAND STACK
          // ============================================================================

          #[derive(Clone, Debug)]
          pub struct HistoryEntry {
              pub label: String,
              pub timestamp_label: String,
              pub state: ProjectState,
          }

          pub struct UndoStack {
              pub entries: Vec<HistoryEntry>,
              pub cursor: usize,
              pub max_depth: usize,
          }

          impl UndoStack {
              pub fn new(initial: ProjectState) -> Self {
                  Self {
                      entries: vec![HistoryEntry {
                          label: "Initial Project Load".to_string(),
                          timestamp_label: "00:00".to_string(),
                          state: initial,
                      }],
                      cursor: 0,
                      max_depth: 64,
                  }
              }

              pub fn record(&mut self, label: impl Into<String>, snapshot: ProjectState, elapsed_secs: u64) {
                  if self.cursor + 1 < self.entries.len() {
                      self.entries.truncate(self.cursor + 1);
                  }
                  let mm = (elapsed_secs / 60) % 60;
                  let ss = elapsed_secs % 60;
                  self.entries.push(HistoryEntry {
                      label: label.into(),
                      timestamp_label: format!("{mm:02}:{ss:02}"),
                      state: snapshot,
                  });
                  if self.entries.len() > self.max_depth {
                      self.entries.remove(0);
                  }
                  self.cursor = self.entries.len() - 1;
              }

              pub fn can_undo(&self) -> bool {
                  self.cursor > 0
              }

              pub fn can_redo(&self) -> bool {
                  self.cursor + 1 < self.entries.len()
              }

              pub fn undo(&mut self) -> Option<(String, ProjectState)> {
                  if self.can_undo() {
                      self.cursor -= 1;
                      let entry = &self.entries[self.cursor];
                      Some((entry.label.clone(), entry.state.clone()))
                  } else {
                      None
                  }
              }

              pub fn redo(&mut self) -> Option<(String, ProjectState)> {
                  if self.can_redo() {
                      self.cursor += 1;
                      let entry = &self.entries[self.cursor];
                      Some((entry.label.clone(), entry.state.clone()))
                  } else {
                      None
                  }
              }
          }

