          #[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
          pub struct KeyBind {
              pub key_name: String,
              pub ctrl_or_cmd: bool,
              pub shift: bool,
              pub alt: bool,
          }

          impl KeyBind {
              pub fn plain(key_name: &str) -> Self {
                  Self {
                      key_name: key_name.to_string(),
                      ctrl_or_cmd: false,
                      shift: false,
                      alt: false,
                  }
              }

              pub fn cmd(key_name: &str) -> Self {
                  Self {
                      key_name: key_name.to_string(),
                      ctrl_or_cmd: true,
                      shift: false,
                      alt: false,
                  }
              }

              pub fn cmd_shift(key_name: &str) -> Self {
                  Self {
                      key_name: key_name.to_string(),
                      ctrl_or_cmd: true,
                      shift: true,
                      alt: false,
                  }
              }

              pub fn shift_only(key_name: &str) -> Self {
                  Self {
                      key_name: key_name.to_string(),
                      ctrl_or_cmd: false,
                      shift: true,
                      alt: false,
                  }
              }

              pub fn display(&self) -> String {
                  let mut out = String::new();
                  if self.ctrl_or_cmd {
                      out.push_str("Ctrl/Cmd+");
                  }
                  if self.alt {
                      out.push_str("Alt+");
                  }
                  if self.shift {
                      out.push_str("Shift+");
                  }
                  out.push_str(&self.key_name);
                  out
              }

              pub fn to_egui_shortcut(&self) -> Option<KeyboardShortcut> {
                  let key = parse_egui_key(&self.key_name)?;
                  let mut mods = Modifiers::NONE;
                  if self.ctrl_or_cmd {
                      mods |= Modifiers::COMMAND;
                  }
                  if self.shift {
                      mods |= Modifiers::SHIFT;
                  }
                  if self.alt {
                      mods |= Modifiers::ALT;
                  }
                  Some(KeyboardShortcut::new(mods, key))
              }
          }

          fn parse_egui_key(name: &str) -> Option<Key> {
              match name {
                  "Space" => Some(Key::Space),
                  "J" => Some(Key::J),
                  "K" => Some(Key::K),
                  "L" => Some(Key::L),
                  "I" => Some(Key::I),
                  "O" => Some(Key::O),
                  "X" => Some(Key::X),
                  "V" => Some(Key::V),
                  "A" => Some(Key::A),
                  "B" => Some(Key::B),
                  "N" => Some(Key::N),
                  "C" => Some(Key::C),
                  "Y" => Some(Key::Y),
                  "U" => Some(Key::U),
                  "S" => Some(Key::S),
                  "M" => Some(Key::M),
                  "Z" => Some(Key::Z),
                  "E" => Some(Key::E),
                  "T" => Some(Key::T),
                  "P" => Some(Key::P),
                  "Q" => Some(Key::Q),
                  "W" => Some(Key::W),
                  "Comma" => Some(Key::Comma),
                  "Period" => Some(Key::Period),
                  "Semicolon" => Some(Key::Semicolon),
                  "Quote" => Some(Key::Quote),
                  "ArrowLeft" => Some(Key::ArrowLeft),
                  "ArrowRight" => Some(Key::ArrowRight),
                  "Delete" => Some(Key::Delete),
                  "Backspace" => Some(Key::Backspace),
                  _ => None,
              }
          }

