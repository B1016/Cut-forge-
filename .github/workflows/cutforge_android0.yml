                  b.insert(ShortcutAction::StepBackFrame, KeyBind::plain("ArrowLeft"));
                  b.insert(ShortcutAction::StepForwardFrame, KeyBind::plain("ArrowRight"));
                  b.insert(ShortcutAction::MarkIn, KeyBind::plain("I"));
                  b.insert(ShortcutAction::MarkOut, KeyBind::plain("O"));
                  b.insert(ShortcutAction::ClearInOut, KeyBind::plain("X"));
                  b.insert(ShortcutAction::InsertFromSource, KeyBind::plain("Comma"));
                  b.insert(ShortcutAction::OverwriteFromSource, KeyBind::plain("Period"));
                  b.insert(ShortcutAction::LiftWorkArea, KeyBind::plain("Semicolon"));
                  b.insert(ShortcutAction::ExtractWorkArea, KeyBind::plain("Quote"));
                  b.insert(ShortcutAction::RazorAtPlayhead, KeyBind::cmd("K"));
                  b.insert(ShortcutAction::RippleDeleteSelected, KeyBind::shift_only("Delete"));
                  b.insert(ShortcutAction::AddMarkerAtPlayhead, KeyBind::plain("M"));
                  b.insert(ShortcutAction::ToolSelection, KeyBind::plain("V"));
                  b.insert(ShortcutAction::ToolTrackForward, KeyBind::plain("A"));
                  b.insert(ShortcutAction::ToolRippleEdit, KeyBind::plain("B"));
                  b.insert(ShortcutAction::ToolRollEdit, KeyBind::plain("N"));
                  b.insert(ShortcutAction::ToolRazor, KeyBind::plain("C"));
                  b.insert(ShortcutAction::ToolSlip, KeyBind::plain("Y"));
                  b.insert(ShortcutAction::ToolSlide, KeyBind::plain("U"));
                  b.insert(ShortcutAction::ToggleSnap, KeyBind::plain("S"));
                  b.insert(ShortcutAction::Undo, KeyBind::cmd("Z"));
                  b.insert(ShortcutAction::Redo, KeyBind::cmd_shift("Z"));
                  b.insert(ShortcutAction::SaveProject, KeyBind::cmd("S"));
