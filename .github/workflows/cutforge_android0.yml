          const AUTOSAVE_STORAGE_KEY: &str = "cutforge_pro_autosave_v1";
          const SHORTCUTS_STORAGE_KEY: &str = "cutforge_pro_shortcuts_v1";
          #[cfg(not(target_arch = "wasm32"))]
          const NATIVE_AUTOSAVE_PATH: &str = ".cutforge.autosave.json";
          #[cfg(not(target_arch = "wasm32"))]
          const NATIVE_LOCKFILE_PATH: &str = ".cutforge.lock";

          impl CutForgeApp {
              pub fn new(cc: &eframe::CreationContext<'_>) -> Self {
                  Self::configure_studio_dark_theme(&cc.egui_ctx);

                  let mut shortcuts = ShortcutProfile::premiere_pro_default();
                  if let Some(storage) = cc.storage {
                      if let Some(saved_shortcuts) = storage.get_string(SHORTCUTS_STORAGE_KEY) {
                          if let Ok(parsed) = serde_json::from_str::<ShortcutProfile>(&saved_shortcuts) {
                              shortcuts = parsed;
                          }
                      }
                  }

                  // Detect unclean shutdown / crash recovery snapshot
                  #[allow(unused_mut)]
                  let mut show_crash_recovery_banner = false;
                  let mut recovered_snapshot: Option<ProjectState> = None;

                  #[cfg(not(target_arch = "wasm32"))]
                  {
                      if std::path::Path::new(NATIVE_LOCKFILE_PATH).exists()
                          && std::path::Path::new(NATIVE_AUTOSAVE_PATH).exists()
                      {
                          if let Ok(raw) = std::fs::read_to_string(NATIVE_AUTOSAVE_PATH) {
                              if let Ok(state) = serde_json::from_str::<ProjectState>(&raw) {
                                  show_crash_recovery_banner = true;
                                  recovered_snapshot = Some(state);
                              }
                          }
                      }
                      let _ = std::fs::write(
                          NATIVE_LOCKFILE_PATH,
                          format!("PID={} ACTIVE SESSION\n", std::process::id()),
                      );
                  }

                  if recovered_snapshot.is_none() {
                      if let Some(storage) = cc.storage {
                          if let Some(raw) = storage.get_string(AUTOSAVE_STORAGE_KEY) {
                              if let Ok(state) = serde_json::from_str::<ProjectState>(&raw) {
                                  recovered_snapshot = Some(state);
                              }
                          }
                      }
                  }

                  let initial_project = ProjectState::demo_studio_project();
                  let undo_stack = UndoStack::new(initial_project.clone());
                  let now = Instant::now();

                  Self {
                      project: initial_project,
                      undo_stack,
                      shortcuts,
                      workspace: WorkspaceLayout::Editing,
                      active_tool: EditTool::Selection,
                      snap_enabled: true,
                      linked_selection: true,
                      show_safe_margins: true,
                      show_thirds_grid: false,
                      monitor_scope: MonitorScopeMode::ProgramComposite,
                      is_playing: false,
                      shuttle_speed: 1.0,
                      source_is_playing: false,
                      last_tick: now,
                      session_start: now,
                      frame_accumulator: 0.0,
                      source_frame_accumulator: 0.0,
                      selected_bin_id: None,
                      bin_search_query: String::new(),
                      bin_grid_view: false,
                      selected_clip_id: Some(201),
                      selected_marker_id: Some(301),
                      selected_caption_id: Some(401),
                      timeline_zoom_px_per_frame: 3.4,
                      timeline_scroll_frames: 0.0,
                      drag_mode: DragMode::None,
                      status_toast: "Ready • Premiere Pro Workspace loaded (60 FPS GPU Compositor active)"
                          .to_string(),
                      show_shortcuts_modal: false,
                      rebinding_action: None,
                      shortcut_search_query: String::new(),
                      show_export_modal: false,
                      show_history_window: false,
                      show_marker_editor_modal: false,
                      show_crash_recovery_banner,
                      recovered_snapshot,
                      autosave_enabled: true,
                      autosave_interval_secs: 30,
                      last_autosave: now,
                      dirty_since_save: false,
                      last_autosave_status: "Autosave Journal: Synchronized".to_string(),
                      export_preset: ExportFormatPreset::H264Mp4Uhd4K,
                      export_hw_encoder: HardwareEncoder::AutoDetectGpu,
                      export_output_path: "CutForge_Master_Export.mp4".to_string(),
                      export_burn_in_captions: true,
                      export_use_in_out: true,
                      export_bitrate_mbps: 45.0,
                      export_progress: None,
                      last_export_log: String::new(),
